    html, body {
      font-family: "Theinhardt", Arial, sans-serif;
      font-size: 12.5pt;
      line-height: 1.4;
    }
    /* The masthead spans the window; the document itself keeps page margins. */
    body { margin: 0; }
    .syllabus-doc {
      margin: 1in auto;
      max-width: 8.5in;
      padding: 0 24px;
    }

    h1, h2 { font-family: "Theinhardt", Arial, sans-serif; }
    h1 {
      font-size: 16pt;
      font-weight: 700;
      padding: 10px 12px;
      background: rgb(200, 200, 200);
      border: 1px solid #000;
      margin: 1.0em 0 0.7em 0;
    }
    h2 {
      font-size: 14pt;
      font-weight: 700;
      margin: 0.9em 0 0.35em 0;
    }
    ul, ol { padding-left: 1.25em; }
    .underline { text-decoration: underline; }
    table th:nth-child(2),
    table td:nth-child(2) { min-width: 6.6em; }
    /* Banded rows for the course schedule table (tagged by schedule.lua): the
       rows are tall and the eye has to track across five columns, so every
       other one carries a very light gray. The PDF does the same in
       template.tex. */
    .schedule-table tbody tr:nth-child(even) { background: #f5f5f5; }

    header { text-align: center; }
    header .course-title { font-size: 21pt; font-weight: 700; margin: 0 0 0.5em 0; }
    .syllabus-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin: 0 0 1.25rem 0;

    .syllabus-meta {
      font-size: 0.75rem;
      color: #999;
      text-align: right;
      white-space: nowrap;
    }
    .syllabus-meta a { color: inherit; }

    img { max-width: 100%; height: auto; }
    /* Signal aspects: the drawing sits beside the rule it stands for, so the
       aspect reads first, then what it tells you to do. The hairline border
       stands in for the signal's backing plate, which makes the lamps legible. */
    .signal-aspect { display: flex; align-items: flex-start; gap: 1.25rem; margin: 1rem 0 1.5rem; }
    .signal-aspect > p:first-child { flex: 0 0 130px; margin: 0; }
    /* The escaped space that keeps pandoc from making this a figure leaves a <br>. */
    .signal-aspect > p:first-child br { display: none; }
    .signal-aspect img { display: block; width: 100%; height: auto; border: 1px solid #565a5c; border-radius: 2px; }
    .signal-aspect-body > :first-child { margin-top: 0; }
    .signal-aspect-body > :last-child { margin-bottom: 0; }
    @media (max-width: 700px) {
      .signal-aspect { gap: 1rem; }
      .signal-aspect > p:first-child { flex-basis: 90px; }
    }

    @media print {
      .site-masthead, .orange-line { display: none; }
      .syllabus-doc { margin: 0 auto; padding: 0; }
    }
