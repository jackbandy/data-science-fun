<!-- Tab identity for the decks, matching the rest of the site. Injected by
     slides/_metadata.yml (include-in-header); the built week*.html are Quarto
     output, so edit this file and re-run shared/build_all_quarto.sh rather than
     them.

     Paths are site-root-relative: the decks are served from
     dodatascience.fun/slides/, and the icons live at the site root alongside the
     ones _includes/icons.html points every Jekyll page at. The og:image has to
     be an absolute URL -- scrapers fetch it over the network. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/orange-line/loop-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/orange-line/apple-touch-icon.png">
<meta name="theme-color" content="#f9461c">
<meta property="og:image" content="https://dodatascience.fun/assets/branding/datasaurus-og.gif">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="742">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dodatascience.fun/assets/branding/datasaurus-og.gif">
