<!-- Closed to automated access until 2027; see the site robots.txt for the
     reasoning and the 2027 reopening checklist. Injected into every rendered
     deck/chapter <head> from the Quarto config, so generated pages carry the
     same directives as the hand-written ones (docs/_includes/crawler-policy.html).
     Keep the two in sync. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="author" type="text/plain" href="/humans.txt">
<!-- Privacy/security half, mirroring docs/_includes/crawler-policy.html but
     scoped to what the decks actually load. Quarto writes inline <script>
     blocks into every deck, so script-src keeps 'unsafe-inline' here. Every
     outside origin is named for one reason:
       script-src   two exact jsDelivr files Quarto adds to decks with Jupyter
                    output; both tags carry SRI hashes. Allowlisted by full
                    path, so nothing else on jsDelivr can load.
       media-src    us2.maindigitalstream.com  UIC Radio stream (radio-player-after-body.html)
       connect-src  www.random.org             roll-call draws in the week1/2/4/5/6 decks
       frame-src    the sites framed on individual slides; add a host here when
                    a new slide embeds one, or the frame will stay blank.
                    https://dodatascience.fun is 'self' once deployed; it is named so the
                    absolute timer/dilemma iframes still work in quarto preview. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js https://cdn.jsdelivr.net/npm/requirejs@2.3.6/require.min.js; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' https://us2.maindigitalstream.com; connect-src 'self' https://www.random.org; frame-src 'self' https://dodatascience.fun https://www.youtube-nocookie.com https://www.uic.edu https://www.gapminder.org https://www.cj2026.northwestern.edu https://www.tylervigen.com; form-action 'none'">
