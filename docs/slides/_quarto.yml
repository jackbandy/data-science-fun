format:
  revealjs:
    theme: shared/theme/uic-orange-reveal.scss
    css: shared/theme/revealjs-common.css
    width: 1280
    height: 720
    margin: 0
    slide-number: c
    controls: true
    progress: true
    # MathML is written by Pandoc at build time, so slide math needs no script
    # (this replaces MathJax 2.7.9 from jsDelivr, which had no SRI hash).
    html-math-method: mathml

# Every deck here keeps its executed notebook, so any deck with Python cells
# produces a weekN.ipynb students can download. Decks with no executable code
# are unaffected (only the jupyter engine emits one). This is the single place
# keep-ipynb is set — do not repeat it in individual deck frontmatter.
execute:
  keep-ipynb: true

slide-level: 1
bibliography: shared/references.bib
lib-dir: _libs
