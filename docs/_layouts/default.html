<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  {% include social-meta.html %}
  {% include icons.html %}
  <link rel="stylesheet" href="{{ '/css/index.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/masthead.css' | relative_url }}">
{%- comment -%}
  Pages needing their own stylesheet list it in front matter as `extra_css:`
  (a list of site-root-relative paths), rather than inlining a <style> block.
{%- endcomment -%}
{% for sheet in page.extra_css %}
  <link rel="stylesheet" href="{{ sheet | relative_url }}">
{% endfor %}
</head>
<body>
  {% include masthead.html %}
  <main class="container">
    {{ content }}
{% if page.show_last_updated %}
    <p class="last-updated">
      Last updated:
      <a href="https://github.com/jackbandy/data-science-fun/commits/">{{ site.time | date: "%B %-d, %Y at %H:%M %Z" }}</a>
    </p>
{% endif %}
  </main>
  {% include footer.html %}
</body>
</html>
