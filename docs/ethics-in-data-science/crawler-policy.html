<!-- Closed to automated access until 2027; see the site robots.txt for the
     reasoning and the 2027 reopening checklist. Injected into every rendered
     deck/chapter <head> from the Quarto config, so generated pages carry the
     same directives as the hand-written ones (docs/_includes/crawler-policy.html).
     Keep the two in sync. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="author" type="text/plain" href="/humans.txt">
<!-- Privacy/security half, mirroring docs/_includes/crawler-policy.html. Quarto
     writes inline <script> blocks into every chapter, so script-src keeps
     'unsafe-inline' here even where the hand-written pages no longer need it.
     Everything else is this origin only: the book loads no third-party script,
     style, font or frame (math is MathML, the font is self-hosted). font-src
     also allows data: for the heading-link icon font that Quarto's anchor.min.js
     embeds inline; that is no outside request. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'none'">
