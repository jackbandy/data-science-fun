<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="618" viewBox="0 0 1000 618" font-family="'Big Shoulders', 'Arial Narrow', Arial, sans-serif">
  <rect width="1000" height="618" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="8" fill="#f9461c"/>
  <text x="60" y="92" font-size="40" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">MINIMAL PALETTE — CTA ORANGE LINE</text>
  <text x="60" y="126" font-size="18" fill="#565a5c" font-family="'ITC Franklin Gothic','Libre Franklin',sans-serif">Brand accent + neutrals. Orange carries focus; neutrals carry everything else.</text>

  <!-- swatches -->
  <g font-family="Courier, 'Courier New', monospace">
    <!-- row positions: x start 60, each 97 wide, gap 0, 9 swatches -->
    <g>
      <rect x="60"  y="180" width="92" height="210" fill="#f9461c"/>
      <rect x="160" y="180" width="92" height="210" fill="#c83214"/>
      <rect x="260" y="180" width="92" height="210" fill="#1a1a1a"/>
      <rect x="360" y="180" width="92" height="210" fill="#444444"/>
      <rect x="460" y="180" width="92" height="210" fill="#565a5c"/>
      <rect x="560" y="180" width="92" height="210" fill="#777777"/>
      <rect x="660" y="180" width="92" height="210" fill="#f4f4f2" stroke="#dddddd"/>
      <rect x="760" y="180" width="92" height="210" fill="#ffffff" stroke="#dddddd"/>
      <rect x="860" y="180" width="80" height="210" fill="#dddddd"/>
    </g>
    <g font-size="13" fill="#1a1a1a" font-family="'ITC Franklin Gothic','Libre Franklin',sans-serif">
      <text x="60"  y="418" font-weight="700">orange</text>
      <text x="160" y="418" font-weight="700">orange-dark</text>
      <text x="260" y="418" font-weight="700">ink</text>
      <text x="360" y="418" font-weight="700">text</text>
      <text x="460" y="418" font-weight="700">steel*</text>
      <text x="560" y="418" font-weight="700">muted</text>
      <text x="660" y="418" font-weight="700">soft-gray</text>
      <text x="760" y="418" font-weight="700">paper</text>
      <text x="860" y="418" font-weight="700">border</text>
    </g>
    <g font-size="13" fill="#565a5c">
      <text x="60"  y="440">#F9461C</text>
      <text x="160" y="440">#C83214</text>
      <text x="260" y="440">#1A1A1A</text>
      <text x="360" y="440">#444444</text>
      <text x="460" y="440">#565A5C</text>
      <text x="560" y="440">#777777</text>
      <text x="660" y="440">#F4F4F2</text>
      <text x="760" y="440">#FFFFFF</text>
      <text x="860" y="440">#DDDDDD</text>
    </g>
  </g>

  <text x="60" y="560" font-size="15" fill="#565a5c" font-family="'ITC Franklin Gothic','Libre Franklin',sans-serif">* steel = official CTA <tspan font-weight="700">Sign Grey #565A5C</tspan>. orange = official CTA <tspan font-weight="700">Orange Line #F9461C</tspan>.</text>
  <text x="60" y="586" font-size="13" fill="#aaaaaa" font-family="Courier,monospace">Original work · colors per CTA Trademark Guidelines for Developers · no CTA marks used</text>
</svg>
