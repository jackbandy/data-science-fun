<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="618" viewBox="0 0 1000 618" font-family="'Big Shoulders', 'Arial Narrow', Arial, sans-serif">
  <rect width="1000" height="618" fill="#ffffff"/>
  <rect x="0" y="0" width="8" height="618" fill="#f9461c"/>

  <!-- distilled logo mark: an orange route segment that turns, with two stops.
       Centered in a notional 320x320 box around (500, 300). -->
  <g transform="translate(500 300)">
    <path d="M -110 90 L -110 -10 C -110 -34 -94 -50 -70 -50 L 40 -50 C 64 -50 80 -66 80 -90"
          fill="none" stroke="#f9461c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- stops: white core + orange ring -->
    <circle cx="-110" cy="60" r="17" fill="#ffffff" stroke="#f9461c" stroke-width="9"/>
    <circle cx="-20" cy="-50" r="17" fill="#ffffff" stroke="#f9461c" stroke-width="9"/>
    <!-- terminal node (filled) -->
    <circle cx="80" cy="-90" r="13" fill="#f9461c"/>
  </g>

  <text x="500" y="500" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a" letter-spacing="1">LINE MARK</text>
  <text x="500" y="534" text-anchor="middle" font-size="17" fill="#565a5c" font-family="'ITC Franklin Gothic','Libre Franklin',sans-serif">the transit motif distilled to a compact mark — rounded joins, ringed stops</text>
  <text x="500" y="592" text-anchor="middle" font-size="13" fill="#aaaaaa" font-family="Courier,monospace">Original mark · CTA Orange Line color #F9461C · not a CTA logo or approximation</text>
</svg>
