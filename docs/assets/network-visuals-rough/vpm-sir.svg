<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290">
  <!-- SIR virus propagation model (CS 418 L20, slide 18) -->
  <style>
    text { font-family: 'Libre Franklin','ITC Franklin Gothic',Arial,sans-serif; }
  </style>
  <defs>
    <marker id="sir-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- S -> I (beta) -->
  <line x1="150" y1="90" x2="290" y2="90" stroke="#111111" stroke-width="2.5" marker-end="url(#sir-arrow)"/>
  <text x="220" y="76" text-anchor="middle" fill="#111111" font-size="20" font-weight="700" font-style="italic">&#946;</text>
  <!-- I -> R (delta) -->
  <path d="M 322 122 Q 300 200 260 205" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#sir-arrow)"/>
  <text x="318" y="175" text-anchor="middle" fill="#111111" font-size="20" font-weight="700" font-style="italic">&#948;</text>

  <!-- States -->
  <circle cx="100" cy="90" r="45" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
  <text x="100" y="100" text-anchor="middle" fill="#111111" font-size="28" font-weight="700">S</text>
  <circle cx="340" cy="90" r="45" fill="#f9461c" stroke="#c83214" stroke-width="3"/>
  <text x="340" y="100" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">I</text>
  <circle cx="220" cy="210" r="45" fill="#565a5c" stroke="#1a1a1a" stroke-width="3"/>
  <text x="220" y="220" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">R</text>

  <text x="100" y="160" text-anchor="middle" fill="#565a5c" font-size="15">Susceptible</text>
  <text x="340" y="160" text-anchor="middle" fill="#565a5c" font-size="15">Infected</text>
  <text x="220" y="278" text-anchor="middle" fill="#565a5c" font-size="15">Recovered</text>
</svg>
