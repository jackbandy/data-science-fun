<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <!-- Graphs model data for many applications (CS 418 L20, slide 3) -->
  <style>
    text { font-family: 'Libre Franklin','ITC Franklin Gothic',Arial,sans-serif; }
  </style>
  <defs>
    <marker id="ga-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- World Wide Web (top-left) -->
  <g id="web">
    <text x="150" y="30" text-anchor="middle" fill="#111111" font-size="18" font-weight="700">World Wide Web</text>
    <line x1="134" y1="80" x2="166" y2="80" stroke="#111111" stroke-width="2.5" marker-end="url(#ga-arrow)"/>
    <line x1="172" y1="92" x2="158" y2="118" stroke="#111111" stroke-width="2.5" marker-end="url(#ga-arrow)"/>
    <line x1="138" y1="118" x2="124" y2="92" stroke="#111111" stroke-width="2.5" marker-end="url(#ga-arrow)"/>
    <circle cx="120" cy="80" r="15" fill="#f9461c" stroke="#c83214" stroke-width="3"/>
    <circle cx="180" cy="80" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <circle cx="150" cy="130" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="150" y="170" text-anchor="middle" fill="#565a5c" font-size="14">Pages &#8594; Links</text>
  </g>

  <!-- Transportation (top-right) -->
  <g id="transport">
    <text x="450" y="30" text-anchor="middle" fill="#111111" font-size="18" font-weight="700">Transportation</text>
    <line x1="415" y1="80" x2="485" y2="80" stroke="#111111" stroke-width="2.5"/>
    <line x1="490" y1="92" x2="462" y2="118" stroke="#111111" stroke-width="2.5"/>
    <line x1="438" y1="118" x2="410" y2="92" stroke="#111111" stroke-width="2.5"/>
    <circle cx="400" cy="80" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <circle cx="500" cy="80" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <circle cx="450" cy="130" r="15" fill="#f9461c" stroke="#c83214" stroke-width="3"/>
    <text x="450" y="170" text-anchor="middle" fill="#565a5c" font-size="14">Stops &#8594; Routes</text>
  </g>

  <!-- Social network (bottom-left) -->
  <g id="social">
    <text x="150" y="240" text-anchor="middle" fill="#111111" font-size="18" font-weight="700">Social Network</text>
    <line x1="120" y1="290" x2="180" y2="290" stroke="#111111" stroke-width="2.5"/>
    <line x1="120" y1="290" x2="100" y2="340" stroke="#111111" stroke-width="2.5"/>
    <line x1="180" y1="290" x2="200" y2="340" stroke="#111111" stroke-width="2.5"/>
    <line x1="100" y1="340" x2="200" y2="340" stroke="#111111" stroke-width="2.5"/>
    <circle cx="120" cy="290" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <circle cx="180" cy="290" r="15" fill="#f9461c" stroke="#c83214" stroke-width="3"/>
    <circle cx="100" cy="340" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <circle cx="200" cy="340" r="15" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="150" y="380" text-anchor="middle" fill="#565a5c" font-size="14">Users &#8594; Friends</text>
  </g>

  <!-- Computer network (bottom-right) -->
  <g id="computer">
    <text x="450" y="240" text-anchor="middle" fill="#111111" font-size="18" font-weight="700">Computer Network</text>
    <line x1="440" y1="290" x2="460" y2="290" stroke="#111111" stroke-width="2.5"/>
    <line x1="425" y1="305" x2="425" y2="325" stroke="#111111" stroke-width="2.5"/>
    <line x1="475" y1="305" x2="475" y2="325" stroke="#111111" stroke-width="2.5"/>
    <line x1="440" y1="340" x2="460" y2="340" stroke="#111111" stroke-width="2.5"/>
    <rect x="410" y="275" width="30" height="30" rx="6" fill="#f9461c" stroke="#c83214" stroke-width="3"/>
    <rect x="460" y="275" width="30" height="30" rx="6" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <rect x="410" y="325" width="30" height="30" rx="6" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <rect x="460" y="325" width="30" height="30" rx="6" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="450" y="380" text-anchor="middle" fill="#565a5c" font-size="14">Devices &#8594; Cables</text>
  </g>
</svg>
