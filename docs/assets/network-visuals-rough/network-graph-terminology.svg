<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Graph terminology example (CS 418 L20, slide 4) -->
  <!-- Vertices U,V,W,X,Y,Z; edges a-h plus self-loop i on Z. deg(X)=4 -->
  <style>
    text { font-family: 'Libre Franklin','ITC Franklin Gothic',Arial,sans-serif; }
  </style>

  <!-- Edges (drawn under nodes) -->
  <!-- c: U-W --> <line x1="110" y1="240" x2="230" y2="160" stroke="#111111" stroke-width="2.5"/>
  <!-- a: U-V --> <line x1="110" y1="240" x2="250" y2="330" stroke="#111111" stroke-width="2.5"/>
  <!-- d: W-V --> <line x1="230" y1="160" x2="250" y2="330" stroke="#111111" stroke-width="2.5"/>
  <!-- e: W-X --> <line x1="230" y1="160" x2="350" y2="240" stroke="#111111" stroke-width="2.5"/>
  <!-- f: W-Y --> <line x1="230" y1="160" x2="320" y2="70"  stroke="#111111" stroke-width="2.5"/>
  <!-- g: Y-X --> <line x1="320" y1="70"  x2="350" y2="240" stroke="#111111" stroke-width="2.5"/>
  <!-- b: V-X --> <line x1="250" y1="330" x2="350" y2="240" stroke="#111111" stroke-width="2.5"/>
  <!-- h: X-Z --> <line x1="350" y1="240" x2="470" y2="240" stroke="#111111" stroke-width="2.5"/>
  <!-- i: Z self-loop -->
  <path d="M 492 226 C 545 200 545 280 492 254" fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- Edge labels -->
  <text x="158" y="195" fill="#111111" font-size="18" font-style="italic">c</text>
  <text x="160" y="295" fill="#111111" font-size="18" font-style="italic">a</text>
  <text x="252" y="255" fill="#111111" font-size="18" font-style="italic">d</text>
  <text x="290" y="190" fill="#111111" font-size="18" font-style="italic">e</text>
  <text x="262" y="120" fill="#111111" font-size="18" font-style="italic">f</text>
  <text x="345" y="150" fill="#111111" font-size="18" font-style="italic">g</text>
  <text x="305" y="305" fill="#111111" font-size="18" font-style="italic">b</text>
  <text x="405" y="230" fill="#111111" font-size="18" font-style="italic">h</text>
  <text x="548" y="246" fill="#111111" font-size="18" font-style="italic">i</text>

  <!-- Nodes -->
  <g font-size="22" font-weight="700" font-style="italic" text-anchor="middle">
    <circle cx="110" cy="240" r="26" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="110" y="248" fill="#111111">U</text>
    <circle cx="250" cy="330" r="26" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="250" y="338" fill="#111111">V</text>
    <circle cx="230" cy="160" r="26" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="230" y="168" fill="#111111">W</text>
    <!-- X is the focal vertex (degree example) -->
    <circle cx="350" cy="240" r="26" fill="#f9461c" stroke="#c83214" stroke-width="3"/>
    <text x="350" y="248" fill="#ffffff">X</text>
    <circle cx="320" cy="70" r="26" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="320" y="78" fill="#111111">Y</text>
    <circle cx="470" cy="240" r="26" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="470" y="248" fill="#111111">Z</text>
  </g>
</svg>
