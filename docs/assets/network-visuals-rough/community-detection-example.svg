<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Community detection: dense within, sparse between (CS 418 L20, slide 7) -->
  <style>
    text { font-family: 'Libre Franklin','ITC Franklin Gothic',Arial,sans-serif; }
  </style>

  <!-- Inter-community edges (sparse, dashed) -->
  <g stroke="#777777" stroke-width="2" stroke-dasharray="9 8">
    <line x1="200" y1="150" x2="280" y2="150"/>
    <line x1="280" y1="150" x2="380" y2="100"/>
    <line x1="320" y1="200" x2="400" y2="280"/>
    <line x1="280" y1="150" x2="320" y2="200"/>
  </g>

  <!-- Community 1 (orange, focal) -->
  <g stroke="#f9461c" stroke-width="2.5">
    <line x1="120" y1="150" x2="160" y2="120"/>
    <line x1="120" y1="150" x2="160" y2="180"/>
    <line x1="120" y1="150" x2="200" y2="150"/>
    <line x1="160" y1="120" x2="200" y2="150"/>
    <line x1="160" y1="180" x2="200" y2="150"/>
    <line x1="160" y1="120" x2="160" y2="180"/>
  </g>
  <g fill="#f9461c" stroke="#c83214" stroke-width="2">
    <circle cx="120" cy="150" r="12"/>
    <circle cx="160" cy="120" r="12"/>
    <circle cx="160" cy="180" r="12"/>
    <circle cx="200" cy="150" r="12"/>
  </g>

  <!-- Community 2 (steel) -->
  <g stroke="#565a5c" stroke-width="2.5">
    <line x1="380" y1="100" x2="420" y2="80"/>
    <line x1="380" y1="100" x2="420" y2="140"/>
    <line x1="420" y1="80" x2="460" y2="100"/>
    <line x1="420" y1="80" x2="420" y2="140"/>
    <line x1="460" y1="100" x2="480" y2="140"/>
    <line x1="460" y1="100" x2="420" y2="140"/>
    <line x1="420" y1="140" x2="480" y2="140"/>
  </g>
  <g fill="#565a5c" stroke="#1a1a1a" stroke-width="2">
    <circle cx="380" cy="100" r="12"/>
    <circle cx="420" cy="80" r="12"/>
    <circle cx="460" cy="100" r="12"/>
    <circle cx="420" cy="140" r="12"/>
    <circle cx="480" cy="140" r="12"/>
  </g>

  <!-- Community 3 (quiet gray) -->
  <g stroke="#aaaaaa" stroke-width="2.5">
    <line x1="400" y1="280" x2="450" y2="260"/>
    <line x1="400" y1="280" x2="450" y2="320"/>
    <line x1="400" y1="280" x2="500" y2="280"/>
    <line x1="450" y1="260" x2="500" y2="280"/>
    <line x1="450" y1="320" x2="500" y2="280"/>
    <line x1="450" y1="260" x2="450" y2="320"/>
  </g>
  <g fill="#aaaaaa" stroke="#565a5c" stroke-width="2">
    <circle cx="400" cy="280" r="12"/>
    <circle cx="450" cy="260" r="12"/>
    <circle cx="450" cy="320" r="12"/>
    <circle cx="500" cy="280" r="12"/>
  </g>

  <!-- Bridge nodes (neutral) -->
  <g fill="#EEEEEE" stroke="#111111" stroke-width="2">
    <circle cx="280" cy="150" r="12"/>
    <circle cx="320" cy="200" r="12"/>
  </g>

  <!-- Labels -->
  <text x="160" y="232" text-anchor="middle" fill="#c83214" font-size="15" font-weight="700">Community 1</text>
  <text x="430" y="52" text-anchor="middle" fill="#565a5c" font-size="15" font-weight="700">Community 2</text>
  <text x="450" y="362" text-anchor="middle" fill="#565a5c" font-size="15" font-weight="700">Community 3</text>

  <text x="300" y="28" text-anchor="middle" fill="#111111" font-size="14" font-style="italic">Dense connections within communities</text>
  <text x="300" y="385" text-anchor="middle" fill="#111111" font-size="14" font-style="italic">Sparse connections between communities</text>
</svg>
