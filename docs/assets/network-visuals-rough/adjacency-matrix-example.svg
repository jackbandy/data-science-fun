<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380">
  <!-- Directed graph and its adjacency matrix (CS 418 L20, slide 5) -->
  <style>
    text { font-family: 'Libre Franklin','ITC Franklin Gothic',Arial,sans-serif; }
  </style>
  <defs>
    <marker id="am-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- Directed graph: nodes 1(TL) 2(TR) 3(BL) 4(BR) -->
  <g stroke="#111111" stroke-width="2.5" fill="none">
    <!-- 1 self-loop -->
    <path d="M 96 78 C 60 50 105 38 122 70" marker-end="url(#am-arrow)"/>
    <!-- 1 -> 3 (left, bow out) -->
    <path d="M 108 130 C 92 175 92 195 108 232" marker-end="url(#am-arrow)"/>
    <!-- 3 -> 1 (left, bow in) -->
    <path d="M 132 232 C 148 195 148 175 132 132" marker-end="url(#am-arrow)"/>
    <!-- 2 -> 1 (top) -->
    <path d="M 292 100 L 152 100" marker-end="url(#am-arrow)"/>
    <!-- 2 -> 3 (diagonal, bow) -->
    <path d="M 288 128 C 220 175 190 195 150 238" marker-end="url(#am-arrow)"/>
    <!-- 3 -> 2 (diagonal, bow other side) -->
    <path d="M 150 252 C 200 230 250 175 300 132" marker-end="url(#am-arrow)"/>
    <!-- 2 -> 4 (right) -->
    <path d="M 320 130 L 320 232" marker-end="url(#am-arrow)"/>
    <!-- 4 -> 1 (long bottom curve) -->
    <path d="M 300 270 C 200 320 150 300 112 138" marker-end="url(#am-arrow)"/>
  </g>
  <g text-anchor="middle" font-size="20" font-weight="700">
    <circle cx="120" cy="100" r="24" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="120" y="108" fill="#111111">1</text>
    <circle cx="320" cy="100" r="24" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="320" y="108" fill="#111111">2</text>
    <circle cx="120" cy="260" r="24" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="120" y="268" fill="#111111">3</text>
    <circle cx="320" cy="260" r="24" fill="#EEEEEE" stroke="#111111" stroke-width="3"/>
    <text x="320" y="268" fill="#111111">4</text>
  </g>

  <!-- Adjacency matrix M -->
  <g>
    <text x="408" y="200" fill="#111111" font-size="26" font-style="italic">M =</text>

    <!-- Column headers -->
    <g fill="#c83214" font-size="18" font-weight="700" text-anchor="middle">
      <text x="490" y="120">1</text>
      <text x="525" y="120">2</text>
      <text x="560" y="120">3</text>
      <text x="595" y="120">4</text>
    </g>
    <!-- Row labels -->
    <g fill="#c83214" font-size="18" font-weight="700" text-anchor="middle">
      <text x="636" y="153">1</text>
      <text x="636" y="188">2</text>
      <text x="636" y="223">3</text>
      <text x="636" y="258">4</text>
    </g>

    <!-- Brackets -->
    <path d="M 467 132 C 460 132 458 135 458 142 L 458 248 C 458 255 460 258 467 258"
          fill="none" stroke="#111111" stroke-width="2.5"/>
    <path d="M 612 132 C 619 132 621 135 621 142 L 621 248 C 621 255 619 258 612 258"
          fill="none" stroke="#111111" stroke-width="2.5"/>

    <!-- Entries -->
    <g fill="#111111" font-size="18" text-anchor="middle">
      <!-- row 1: 1 0 1 0 -->
      <text x="490" y="153">1</text><text x="525" y="153">0</text><text x="560" y="153">1</text><text x="595" y="153">0</text>
      <!-- row 2: 1 0 1 1 -->
      <text x="490" y="188">1</text><text x="525" y="188">0</text><text x="560" y="188">1</text><text x="595" y="188">1</text>
      <!-- row 3: 1 1 0 0 -->
      <text x="490" y="223">1</text><text x="525" y="223">1</text><text x="560" y="223">0</text><text x="595" y="223">0</text>
      <!-- row 4: 1 0 0 0 -->
      <text x="490" y="258">1</text><text x="525" y="258">0</text><text x="560" y="258">0</text><text x="595" y="258">0</text>
    </g>
  </g>

  <!-- Definition -->
  <text x="320" y="340" text-anchor="middle" fill="#444444" font-size="15">
    M<tspan baseline-shift="sub" font-size="11">ij</tspan> = 1 if (v<tspan baseline-shift="sub" font-size="11">i</tspan>, v<tspan baseline-shift="sub" font-size="11">j</tspan>) &#8712; E,  else 0
  </text>
</svg>
