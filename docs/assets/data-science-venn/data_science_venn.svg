<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556">
  <defs>
    <style>
      @font-face {
        font-family: 'Libre Franklin';
        src: url('../fonts/libre-franklin/LibreFranklin.woff2') format('woff2');
      }
      text {
        font-family: 'Libre Franklin', sans-serif;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="900" height="556" fill="white"/>

  <!--
    Equilateral triangle arrangement, side = 160px, r = 185px
    Left  (Hacking Skills):           cx=370, cy=209
    Right (Math & Statistics):        cx=530, cy=209
    Bottom (Substantive Expertise):   cx=450, cy=348
    All pairwise distances ≈ 160px — good overlap for a traditional Venn look.
    Canvas 900×556 is a golden-ratio landscape rectangle (900/556 ≈ φ).
    185px left/right margins flank the diagram, giving breathing room for labels.
  -->

  <circle cx="370" cy="209" r="185" fill="#cccccc" fill-opacity="0.32"/>
  <circle cx="530" cy="209" r="185" fill="#cccccc" fill-opacity="0.32"/>
  <circle cx="450" cy="348" r="185" fill="#cccccc" fill-opacity="0.32"/>

  <!-- Hacking Skills — upper-left exclusive petal -->
  <text x="255" y="172" font-size="24" font-weight="600" fill="#2a2a2a">Hacking</text>
  <text x="255" y="201" font-size="24" font-weight="600" fill="#2a2a2a">Skills</text>

  <!-- Math &amp; Statistics Knowledge — upper-right exclusive petal -->
  <text x="643" y="160" font-size="24" font-weight="600" fill="#2a2a2a">Math &amp;</text>
  <text x="643" y="189" font-size="24" font-weight="600" fill="#2a2a2a">Statistics</text>
  <text x="643" y="218" font-size="24" font-weight="600" fill="#2a2a2a">Knowledge</text>

  <!-- Substantive Expertise — bottom exclusive petal -->
  <text x="450" y="477" font-size="24" font-weight="600" fill="#2a2a2a">Substantive</text>
  <text x="450" y="506" font-size="24" font-weight="600" fill="#2a2a2a">Expertise</text>

  <!-- Machine Learning — top two circles only (above bottom circle) -->
  <text x="450" y="128" font-size="13" fill="#555555">Machine</text>
  <text x="450" y="145" font-size="13" fill="#555555">Learning</text>

  <!-- Data Science — triple intersection -->
  <text x="450" y="249" font-size="16" font-weight="700" fill="#1a1a1a">Data</text>
  <text x="450" y="269" font-size="16" font-weight="700" fill="#1a1a1a">Science</text>

  <!-- Danger Zone! — left ∩ bottom, outside right -->
  <text x="340" y="307" font-size="13" fill="#555555">Danger</text>
  <text x="340" y="324" font-size="13" fill="#555555">Zone!</text>

  <!-- Traditional Research — right ∩ bottom, outside left -->
  <text x="560" y="307" font-size="13" fill="#555555">Traditional</text>
  <text x="560" y="324" font-size="13" fill="#555555">Research</text>
</svg>
