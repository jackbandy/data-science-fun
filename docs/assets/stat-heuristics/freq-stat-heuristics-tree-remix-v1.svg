<svg viewBox="0 0 1320 640" xmlns="http://www.w3.org/2000/svg"
     font-family="Libre Franklin, Helvetica Neue, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="ttl">
<title id="ttl">Decision tree for choosing a frequentist statistical test, branching from data type through parametric assumptions to specific tests.</title>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3034"/>
  </marker>
</defs>

<g fill="none" stroke="#2B3034" stroke-width="1.5" marker-end="url(#arrow)">
  <!-- root: type of data -->
  <line x1="590" y1="32" x2="758" y2="32"/>
  <path d="M 530 49 L 530 72 L 450 72 L 450 93"/>
  <!-- categorical branch -->
  <line x1="820" y1="49" x2="820" y2="93"/>
  <path d="M 860 49 L 860 70 L 1000 70 L 1000 93"/>
  <!-- type of question fork -->
  <path d="M 450 129 L 450 155 L 140 155 L 140 178"/>
  <path d="M 450 129 L 450 155 L 570 155 L 570 178"/>
  <!-- differences between what: fork to means / variances -->
  <path d="M 650 204 L 700 204 L 700 190 L 788 190"/>
  <path d="M 650 204 L 700 204 L 700 245 L 788 245"/>
  <line x1="570" y1="228" x2="570" y2="268"/>
  <!-- relationships fork -->
  <path d="M 140 228 L 140 250 L 75 250 L 75 268"/>
  <path d="M 140 228 L 140 250 L 240 250 L 240 268"/>
  <path d="M 240 312 L 240 331 L 175 331 L 175 348"/>
  <path d="M 240 312 L 240 331 L 342 331 L 342 348"/>
  <!-- how many groups fork -->
  <path d="M 575 318 L 575 335 L 745 335 L 745 358"/>
  <path d="M 575 318 L 575 335 L 975 335 L 975 358"/>
  <!-- two-groups subtree -->
  <path d="M 650 384 L 622 388"/>
  <path d="M 745 408 L 750 458"/>
  <path d="M 560 418 L 570 458"/>
  <!-- more-than-two subtree -->
  <path d="M 1070 384 L 1108 388"/>
  <path d="M 975 408 L 985 458"/>
  <path d="M 1180 418 L 1180 458"/>
  <!-- to post hoc -->
  <path d="M 985 502 L 985 525 L 1080 525 L 1080 553"/>
  <path d="M 1180 508 L 1180 525 L 1080 525"/>
</g>

<!-- dashed feedback loops: transform, then re-check parametric assumptions -->
<g fill="none" stroke="#2B3034" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)">
  <path d="M 560 360 C 560 340, 745 340, 745 360"/>
  <path d="M 1180 360 C 1180 340, 975 340, 975 360"/>
</g>

<!-- edge labels -->
<g font-size="12" fill="#4A5057">
  <text x="600" y="26">Discrete, categorical</text>
  <text x="464" y="66">Continuous</text>
  <text x="828" y="76">No</text>
  <text x="905" y="66">Yes</text>
  <text x="180" y="150">Relationships</text>
  <text x="510" y="150">Differences</text>
  <text x="712" y="186">Means</text>
  <text x="708" y="241">Variances</text>
  <text x="578" y="255" font-size="11">Multiple means,</text>
  <text x="578" y="267" font-size="11">single variable</text>
  <text x="105" y="246">Yes</text>
  <text x="192" y="246">No</text>
  <text x="190" y="327">Parametric</text>
  <text x="330" y="327">Nonparametric</text>
  <text x="720" y="332" text-anchor="end">Two</text>
  <text x="835" y="332">More than two</text>
  <text x="600" y="380">No</text>
  <text x="765" y="440">Yes</text>
  <text x="537" y="440">No</text>
  <text x="1000" y="440">Yes</text>
  <text x="1188" y="440">No</text>
  <text x="640" y="345" font-style="italic">OK</text>
  <text x="1065" y="345" font-style="italic">OK</text>
</g>

<!-- boxes -->
<g font-size="13.5" fill="#2B3034">
  <!-- assumptions panel -->
  <rect x="10" y="10" width="210" height="95" rx="4" fill="#fff" stroke="#2B3034" stroke-width="1.5"/>
  <text x="20" y="30" font-weight="700">Parametric assumptions:</text>
  <text x="20" y="50">(1) Independent samples</text>
  <text x="20" y="68">(2) Data normally distributed</text>
  <text x="20" y="86">(3) Equal variances</text>

  <rect x="470" y="15" width="120" height="34" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="530" y="36" text-anchor="middle">Type of data?</text>

  <rect x="760" y="15" width="140" height="34" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="830" y="36" text-anchor="middle">Any counts &lt; 5?</text>

  <rect x="380" y="95" width="140" height="34" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="450" y="116" text-anchor="middle">Type of question?</text>

  <rect x="740" y="95" width="160" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="820" y="115" text-anchor="middle">Chi-square tests, one</text>
  <text x="820" y="131" text-anchor="middle">and two sample</text>

  <rect x="930" y="95" width="140" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="1000" y="123" text-anchor="middle">Fisher's exact test</text>

  <rect x="20" y="180" width="240" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="140" y="200" text-anchor="middle">Do you have dependent &amp;</text>
  <text x="140" y="216" text-anchor="middle">independent variables?</text>

  <rect x="490" y="180" width="160" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="570" y="200" text-anchor="middle">Differences</text>
  <text x="570" y="216" text-anchor="middle">between what?</text>

  <rect x="788" y="170" width="140" height="40" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="858" y="194" text-anchor="middle">One-sample t-test</text>

  <rect x="788" y="225" width="170" height="40" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="873" y="240" text-anchor="middle">Fmax test or</text>
  <text x="873" y="256" text-anchor="middle">Bartlett's test</text>

  <rect x="10" y="270" width="130" height="42" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="75" y="295" text-anchor="middle">Regression analysis</text>

  <rect x="175" y="270" width="130" height="42" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="240" y="295" text-anchor="middle">Correlation analysis</text>

  <rect x="490" y="270" width="170" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="575" y="290" text-anchor="middle">How many</text>
  <text x="575" y="306" text-anchor="middle">groups?</text>

  <rect x="120" y="350" width="110" height="42" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="175" y="375" text-anchor="middle">Pearson's r</text>

  <rect x="255" y="350" width="175" height="42" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="342" y="367" text-anchor="middle">Spearman's rank</text>
  <text x="342" y="383" text-anchor="middle">correlation</text>

  <rect x="500" y="360" width="120" height="58" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="560" y="393" text-anchor="middle">Transform data?</text>

  <rect x="650" y="360" width="190" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="745" y="380" text-anchor="middle">Parametric assumptions</text>
  <text x="745" y="396" text-anchor="middle">satisfied?</text>

  <rect x="880" y="360" width="190" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="975" y="380" text-anchor="middle">Parametric assumptions</text>
  <text x="975" y="396" text-anchor="middle">satisfied?</text>

  <rect x="1110" y="360" width="120" height="58" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="1170" y="393" text-anchor="middle">Transform data?</text>

  <rect x="480" y="460" width="180" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="570" y="480" text-anchor="middle">Mann-Whitney U or</text>
  <text x="570" y="496" text-anchor="middle">Wilcoxon test</text>

  <rect x="690" y="460" width="140" height="42" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="760" y="485" text-anchor="middle">Student's t-test</text>

  <rect x="910" y="460" width="150" height="42" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="985" y="485" text-anchor="middle">One-way ANOVA</text>

  <rect x="1095" y="460" width="170" height="48" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="1180" y="480" text-anchor="middle">Kruskal-Wallis</text>
  <text x="1180" y="496" text-anchor="middle">test</text>

  <rect x="890" y="555" width="380" height="58" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="1080" y="577" text-anchor="middle">If significant, do <tspan font-style="italic">post hoc</tspan> test:</text>
  <text x="1080" y="595" text-anchor="middle">Bonferroni's, Dunn's, Tukey's, etc.</text>
</g>
