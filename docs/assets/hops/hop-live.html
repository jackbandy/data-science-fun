<!doctype html>
<!--
NOTICE: This file was drafted by an LLM coding system. It is maintained,
reviewed, and vetted by humans.

Live Hypothetical Outcome Plot (HOP) for the Week 6 slides, after the
error-bar vs. HOP comparison in Hullman, Resnick & Adar (2015),
doi:10.1371/journal.pone.0142444. Left: a static summary (mean ± 2 SD).
Right: the same two distributions, one random draw per frame. The larger
draw in each frame is orange, as in hops-ridership-ordering.gif; the tally
under the HOP is the "counting" the paper says viewers do. Click to pause.

A ~ Normal(45, 12), B ~ Normal(55, 12), so P(B > A) ≈ 0.72.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Same policy as docs/_includes/crawler-policy.html; this page has no front
     matter, so it cannot use the include. Keep the two in sync. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'">
<title>Live HOP</title>
<style>
  @font-face {
    font-family: "Libre Franklin";
    src: url("../fonts/libre-franklin/LibreFranklin.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; height: 100%; background: #fff; }
  svg { display: block; width: 100%; height: 100%; cursor: pointer;
        font-family: "Libre Franklin", Arial, sans-serif; }
  .panel-title { fill: #1a1a1a; font-size: 19px; font-weight: 700; }
  .panel-sub   { fill: #777; font-size: 14px; }
  .cat         { fill: #565a5c; font-size: 18px; font-weight: 700; }
  .tick        { fill: #777; font-size: 13px; }
  .grid        { stroke: #ddd; stroke-width: 1; }
  .tally       { fill: #444; font-size: 15px; }
  .hint        { fill: #aaa; font-size: 12px; }
</style>
</head>
<body>
<svg id="hop" viewBox="0 0 600 440" role="img" aria-labelledby="hop-title hop-desc">
  <title id="hop-title">Error bars versus a live hypothetical outcome plot</title>
  <desc id="hop-desc">Two variables, A and B. On the left, each is summarized by a static error bar spanning its mean plus or minus two standard deviations; the bars overlap heavily. On the right, a horizontal mark for each variable jumps to a new random draw several times per second, with the larger of the two drawn in orange. B is larger in roughly seven of every ten frames, and a running tally counts how often.</desc>
</svg>
<script src="hop-live.js"></script>
</body>
</html>
