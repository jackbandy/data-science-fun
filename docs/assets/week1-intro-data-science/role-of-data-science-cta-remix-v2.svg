<!-- NOTICE: substantially generated by an LLM coding agent (Claude), 2026-07-30.
     v2 of role-of-data-science-cta-remix.svg. Adds one change: a transparent orange rounded
     rectangle sits behind the Loop's three nested tracks and behind the full "DATA SCIENCE"
     label, visually tying the label to the circuit it names. Its bounds were measured in a
     rendered browser (getBBox on the loop's outermost rect and on both text elements), then
     padded outward, so it fully encloses both without hugging either edge.
     Everything below this rect is unchanged from the v3 remix: a remix of the CTA "L" map
     graphic in il_1588xN.6073976250_pdms.jpg.avif. Every rail line was traced out of that
     image into the vector paths below; no raster is embedded. Each line is relabelled as a
     domain that data science works in, and greyed out. The Orange Line and its Loop track
     stay in the course accent orange: data science is the one line still in colour, the
     through-line every domain shares, and it runs its own circuit inside the Loop the other
     lines circle.
     Labels and the trimmed sports line come from role-of-data-science-cta-remix-v2.pdf (an
     unrelated prior source PDF; not to be confused with this SVG's own v2).
     Where one line crossed another the trace had recorded a break, since the source raster
     hid the line running behind; those are single strokes now, so every route reads through,
     including the sports line's passage down through the Loop.
     Every elbow is a circular fillet of one radius (14, shrinking only where the adjacent
     runs are too short to hold it), and every sideways jog a symmetric two-arc S-curve, so no
     two corners round at different rates. Every label sits a uniform 12 units of white from
     the ink of the line it names. Inside the Loop the four tracks are spaced 2.5 apart.
     Canvas is a golden-ratio portrait: 1:1.618, content centred.
     The line-to-domain assignment is editorial, not factual. Verify before publishing. -->
