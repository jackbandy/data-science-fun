<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="989" viewBox="0 0 1600 989">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Codystar:wght@300;400&amp;family=VT323&amp;display=swap');
      .lbl-data   { font-family: 'Codystar', 'Courier New', monospace; font-size: 66px; letter-spacing: 3px; }
      .lbl-info   { font-family: 'VT323', monospace; font-size: 72px; }
      .lbl-know   { font-family: 'Noteworthy', 'Chalkboard SE', cursive; font-size: 60px; }
      .lbl-wisdom { font-family: 'Arial Black', Arial, sans-serif; font-size: 60px; font-weight: 900; font-style: italic; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white" />

  <!-- Layer division lines: side face -->
  <line x1="1126.37" y1="682.93" x2="1216.37" y2="630.43" stroke="black" stroke-width="3" />
  <line x1="1017.58" y1="494.50" x2="1077.58" y2="459.50" stroke="black" stroke-width="3" />
  <line x1="908.79"  y1="306.07" x2="938.79"  y2="288.57" stroke="black" stroke-width="3" />

  <!-- Layer division lines: front face -->
  <line x1="473.63" y1="682.93" x2="1126.37" y2="682.93" stroke="black" stroke-width="3" />
  <line x1="582.42" y1="494.50" x2="1017.58" y2="494.50" stroke="black" stroke-width="3" />
  <line x1="691.21" y1="306.07" x2="908.79"  y2="306.07" stroke="black" stroke-width="3" />

  <!-- Pyramid outline -->
  <polygon points="364.84,871.36 800.00,117.64 1235.16,871.36" fill="none" stroke="black" stroke-width="6" stroke-linejoin="round" />
  <polyline points="1235.16,871.36 1355.16,801.36 800.00,117.64" fill="none" stroke="black" stroke-width="6" stroke-linejoin="round" />

  <!-- Dashed connectors from labels to layers -->
  <line x1="345" y1="777.15" x2="419.24" y2="777.15" stroke="#555" stroke-width="2" stroke-dasharray="9 6" />
  <line x1="345" y1="588.72" x2="528.03" y2="588.72" stroke="#555" stroke-width="2" stroke-dasharray="9 6" />
  <line x1="345" y1="400.29" x2="636.82" y2="400.29" stroke="#555" stroke-width="2" stroke-dasharray="9 6" />
  <line x1="345" y1="211.86" x2="745.61" y2="211.86" stroke="#555" stroke-width="2" stroke-dasharray="9 6" />

  <!-- Layer labels -->
  <text class="lbl-data"   x="330" y="777.15" text-anchor="end" dominant-baseline="middle" fill="black">data</text>
  <text class="lbl-info"   x="330" y="588.72" text-anchor="end" dominant-baseline="middle" fill="black">information</text>
  <text class="lbl-know"   x="330" y="400.29" text-anchor="end" dominant-baseline="middle" fill="black">knowledge</text>
  <text class="lbl-wisdom" x="330" y="211.86" text-anchor="end" dominant-baseline="middle" fill="black">wisdom</text>

</svg>
