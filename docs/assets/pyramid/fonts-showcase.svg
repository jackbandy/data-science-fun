<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Codystar:wght@400&amp;family=VT323&amp;family=Kalam&amp;family=Cormorant+Garamond:ital@1&amp;family=Major+Mono+Display&amp;family=Shadows+Into+Light&amp;family=EB+Garamond:ital@1&amp;family=Space+Mono&amp;family=Gloria+Hallelujah&amp;family=Libre+Baskerville:ital@1&amp;display=swap');

      .head    { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 1px; fill: #888; }

      /* system / safe fonts */
      .s-amtype      { font-family: 'American Typewriter', 'Courier New', monospace; font-size: 42px; }
      .s-menlo       { font-family: 'Menlo', 'Monaco', monospace; font-size: 38px; }
      .s-bradley     { font-family: 'Bradley Hand', 'Chalkboard SE', cursive; font-size: 44px; }
      .s-baskerville { font-family: 'Baskerville', 'Times New Roman', serif; font-size: 44px; font-style: italic; }
      .s-arialblack  { font-family: 'Arial Black', Arial, sans-serif; font-size: 40px; font-weight: 900; }
      .s-andale      { font-family: 'Andale Mono', 'Courier New', monospace; font-size: 38px; }
      .s-marker      { font-family: 'Marker Felt', 'Comic Sans MS', cursive; font-size: 42px; }
      .s-didot       { font-family: 'Didot', 'Hoefler Text', serif; font-size: 44px; font-style: italic; }
      .s-impact      { font-family: 'Impact', 'Haettenschweiler', sans-serif; font-size: 44px; letter-spacing: 1px; }
      .s-courier     { font-family: 'Courier', 'Courier New', monospace; font-size: 40px; font-weight: 700; }
      .s-noteworthy  { font-family: 'Noteworthy', 'Chalkboard SE', cursive; font-size: 40px; }
      .s-palatino    { font-family: 'Palatino', 'Palatino Linotype', serif; font-size: 44px; font-style: italic; }

      /* google fonts */
      .g-codystar    { font-family: 'Codystar', monospace; font-size: 44px; letter-spacing: 2px; }
      .g-vt323       { font-family: 'VT323', monospace; font-size: 50px; }
      .g-kalam       { font-family: 'Kalam', cursive; font-size: 42px; }
      .g-cormorant   { font-family: 'Cormorant Garamond', serif; font-size: 46px; font-style: italic; }
      .g-major       { font-family: 'Major Mono Display', monospace; font-size: 30px; }
      .g-shadows     { font-family: 'Shadows Into Light', cursive; font-size: 46px; }
      .g-ebgaramond  { font-family: 'EB Garamond', serif; font-size: 46px; font-style: italic; }
      .g-spacemono   { font-family: 'Space Mono', monospace; font-size: 38px; }
      .g-gloria      { font-family: 'Gloria Hallelujah', cursive; font-size: 36px; }
      .g-libre       { font-family: 'Libre Baskerville', serif; font-size: 38px; font-style: italic; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white" />

  <!-- column divider -->
  <line x1="800" y1="60" x2="800" y2="1060" stroke="#ddd" stroke-width="2" />

  <!-- headers -->
  <text class="head" x="80"   y="90">SYSTEM / SAFE FONTS</text>
  <text class="head" x="1520" y="90" text-anchor="end">GOOGLE FONTS</text>

  <!-- system / safe fonts (left, left-aligned) -->
  <text class="s-amtype"      x="80" y="180">American Typewriter</text>
  <text class="s-menlo"       x="80" y="252">Menlo</text>
  <text class="s-bradley"     x="80" y="324">Bradley Hand</text>
  <text class="s-baskerville" x="80" y="396">Baskerville</text>
  <text class="s-arialblack"  x="80" y="468">Arial Black</text>
  <text class="s-andale"      x="80" y="540">Andale Mono</text>
  <text class="s-marker"      x="80" y="612">Marker Felt</text>
  <text class="s-didot"       x="80" y="684">Didot</text>
  <text class="s-impact"      x="80" y="756">Impact</text>
  <text class="s-courier"     x="80" y="828">Courier</text>
  <text class="s-noteworthy"  x="80" y="900">Noteworthy</text>
  <text class="s-palatino"    x="80" y="972">Palatino</text>

  <!-- google fonts (right, right-aligned) -->
  <text class="g-codystar"   x="1520" y="180" text-anchor="end">Codystar</text>
  <text class="g-vt323"      x="1520" y="252" text-anchor="end">VT323</text>
  <text class="g-kalam"      x="1520" y="324" text-anchor="end">Kalam</text>
  <text class="g-cormorant"  x="1520" y="396" text-anchor="end">Cormorant Garamond</text>
  <text class="g-major"      x="1520" y="468" text-anchor="end">Major Mono Display</text>
  <text class="g-shadows"    x="1520" y="540" text-anchor="end">Shadows Into Light</text>
  <text class="g-ebgaramond" x="1520" y="612" text-anchor="end">EB Garamond</text>
  <text class="g-spacemono"  x="1520" y="684" text-anchor="end">Space Mono</text>
  <text class="g-gloria"     x="1520" y="756" text-anchor="end">Gloria Hallelujah</text>
  <text class="g-libre"      x="1520" y="828" text-anchor="end">Libre Baskerville</text>

</svg>
