markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

url: "https://dodatascience.fun"
# Source repo. Used by the exercise pages to link each starter file back to the
# copy under exercises/ that the build reads (docs/exercises/ is generated).
repo: "https://github.com/jackbandy/data-science-fun"
include:
  - .well-known
title: Introduction to Data Science
description: Materials for CS 418 - Intro to Data Science at UIC

# Preview card. Ownership is split so no tag is emitted twice with two different values:
# jekyll-seo-tag emits og:image, twitter:image and twitter:card, and
# _includes/social-meta.html adds only what seo-tag has no opinion about (secure_url,
# type, dimensions, alt text, and the static PNG fallback).
#
# The image has to arrive as *page* front matter, hence the `defaults` block rather than a
# top-level `image:` key: seo-tag 2.7.1 reads page["image"] and never looks at site.image,
# so a site-level key is silently ignored and every page ships twitter:card=summary with
# no picture at all. Jekyll's defaults inject it into each page's front matter, where
# seo-tag does see it. index.html has no {% seo %} and so includes social-meta.html with
# `primary=true` to emit the base tags itself.
#
# The `twitter:` block must keep its `username`: seo-tag renders `twitter:site` from the
# mere presence of the block, so dropping the key ships a literal `content="@"`.
twitter:
  username: jackbandy
defaults:
  - scope:
      path: ""
    values:
      image: /assets/branding/datasaurus-og.gif
social:
  image: /assets/branding/datasaurus-og.gif
  image_fallback: /assets/branding/datasaurus-og.png
  # A golden rectangle rather than the 1200x630 most cards assume: the Datasaurus shapes
  # are taller than they are wide and must not be squashed, so the frame follows them.
  # Scrapers that letterbox show the whole thing; ones that crop to 1.91:1 take a band out
  # of the middle, which is still the cloud.
  image_width: 1200
  image_height: 742
  image_alt: >-
    A cloud of orange dots rearranging itself between the Chicago Orange Line route, a
    dinosaur, a star, a circle and a grid of dots -- five datasets with the same summary
    statistics and nothing else in common.

# Jekyll renders any file with YAML front matter, whatever its extension. The
# Quarto sources below all have it, so without these entries Jekyll would render
# e.g. slides/week0.qmd over the real Reveal.js deck Quarto built there. Quarto's
# generated output has no front matter, so it is copied through untouched.
exclude:
  # Slide sources -- Quarto compiles these into slides/week*.html
  - slides/*.md
  - slides/*.qmd
  # Quarto book sources (published HTML lives in `ethics-in-data-science/book/`)
  - ethics-in-data-science/*.md
  - ethics-in-data-science/_quarto.yml
  - ethics-in-data-science/references.bib
  - ethics-in-data-science/.quarto
  - ethics-in-data-science/.venv
  - ethics-in-data-science/assets
  # Attribution/licensing notes that live next to the assets they document.
  # The github-pages gem bundles jekyll-optional-front-matter and
  # jekyll-readme-index, which would otherwise render each one into a bare,
  # layout-less public page and list it in sitemap.xml.
  - assets/*.md
  - assets/**/*.md
  # Obscure Films source notes (the published page is index.html; the README
  # stays source-only, same reason as the assets notes above).
  - obscure-films/*.md
  # Local Jekyll tooling, never part of the site
  - Gemfile
  - Gemfile.lock
  - vendor

# Without this the github-pages gem applies jekyll-theme-primer and writes a
# theme stylesheet into assets/css/; this site brings its own CSS.
theme: null
timezone: America/Chicago
future: false
lsi: false
