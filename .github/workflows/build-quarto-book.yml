name: Build Quarto mini-book

on:
  push:
    branches: [main]
    paths:
      - "docs/ethics-in-data-science/**"
      - "docs/_config.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto book
        run: quarto render docs/ethics-in-data-science

      - name: Commit rendered book output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/ethics-in-data-science/book
          if [ -f docs/ethics-in-data-science/index.html ]; then
            git add docs/ethics-in-data-science/index.html
          fi
          git diff --staged --quiet || (git commit -m "Build Quarto mini-book" && git push)
