# NOTICE: This file was generated by an LLM coding system on 2026-08-15.
name: Rebuild meta-analytics data

# Regenerates docs/meta-analytics/data/{links,words}.json — the outbound-link
# and word-frequency counts plotted on /meta-analytics/ — and commits them when
# they change. The page loads those JSON files at runtime, so a commit here is
# what makes the charts current; deploy-pages.yml then publishes as usual.
#
# Runs on a schedule rather than on every push so the site's own history
# doesn't fill with counting commits.

on:
  schedule:
    # Thursdays at 12:00 UTC, an hour after link-check-external.yml, so the
    # counts and the rot report describe the same set of links.
    - cron: "0 12 * * 4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "meta_analytics_source/**"
      - ".github/workflows/meta-analytics.yml"

permissions:
  contents: write

concurrency:
  group: meta-analytics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The script shells out to `lychee --dump`, which extracts links without
      # checking them — the same extractor link-check-external.yml checks with.
      # lychee-action only runs a check, so the binary is installed directly.
      # Pinned: a lychee release that changed its dump output would silently
      # change the numbers on the page.
      - name: Install lychee
        env:
          LYCHEE_TAG: lychee-v0.24.2
          ASSET: lychee-x86_64-unknown-linux-gnu.tar.gz
        run: |
          base="https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_TAG}"
          curl -fsSL -o "$ASSET" "$base/$ASSET"
          curl -fsSL -o "$ASSET.sha256" "$base/$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          tar -xzf "$ASSET" lychee
          sudo install -m 755 lychee /usr/local/bin/lychee
          rm -f lychee "$ASSET" "$ASSET.sha256"
          lychee --version

      # The English baseline for the "Unusual words" section. build_data.py
      # downloads it on a miss; caching keeps that to roughly once a month
      # instead of every run. Not committed to the repo -- see
      # meta_analytics_source/english_frequencies.md for why.
      - name: Cache the English frequency baseline
        uses: actions/cache@v6
        with:
          path: meta_analytics_source/.cache
          key: english-frequencies-count_1w-v1

      - name: Rebuild the data
        run: python3 meta_analytics_source/build_data.py

      - name: Commit if anything changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- docs/meta-analytics/data; then
            echo "Counts unchanged; nothing to commit."
            exit 0
          fi
          git add docs/meta-analytics/data
          git commit -m "Refresh meta-analytics counts"
          git push
