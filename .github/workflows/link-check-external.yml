name: Check external links

# links to readings, datasets, tool docs, websites, etc.
# can break over time
#
# This setup should check for broken links once a week and file a GitHub issue
# listing what's broken,
#
# reads the source files, not the built site

on:
  schedule:
    # Thursdays at 11:00 UTC, which is 6am in Chicago during daylight saving
    # time and 5am the rest of the year. GitHub only accepts UTC here, so the
    # local time shifts by an hour when the clocks change.
    - cron: "0 11 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-external
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # --exclude '^/' drops root-relative links (docs/security.md's
      # "/.well-known/security.txt", and the masthead nav). They only resolve
      # against the built site, and deploy-pages.yml already checks them there
      # with --root-dir _site. Checked here they can only ever error. It is set
      # here rather than in .lycheeignore because that file is shared with
      # deploy-pages.yml, where these links must keep being checked.
      #
      # Two of the --exclude-path entries below are not about link rot:
      #
      # docs/_includes/masthead.html is a Jekyll template whose nav links are
      # root-relative; it stays excluded because the file is otherwise all
      # template syntax.
      #
      # docs/assets/fonts holds vendored upstream READMEs. Their links are the
      # font authors' (including a typo'd "cyreal.rog" that ships upstream),
      # not ours to fix, and editing them would fork the vendored copy.
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-verbatim
            --scheme https
            --scheme http
            --max-concurrency 8
            --timeout 20
            --max-retries 2
            --accept 200..=299,403,429
            --exclude '^/'
            --exclude-path docs/ethics-in-data-science/book
            --exclude-path docs/slides/marp_archive
            --exclude-path docs/slides/_libs
            --exclude-path docs/syllabus
            --exclude-path docs/_includes/masthead.html
            --exclude-path docs/assets/fonts
            'README.md'
            'NOTES.md'
            'docs/**/*.md'
            'docs/**/*.qmd'
            'docs/**/*.html'
            'docs/_data/**/*.yml'
            'syllabus_source/**/*.md'
            'worksheets_source/**/*.md'
          output: ./lychee/out.md
          # don't fail the job over a broken link
          fail: false

      # create-issue-from-file only updates an existing issue when it is handed
      # an issue-number; with just a title it opens a new one every time. Look
      # the open report up here so a second bad week edits last week's issue
      # instead of filing a duplicate. Empty output means "none open, file one".
      - name: Find the open tracking issue
        id: tracking_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue=$(gh issue list --state open --label link-rot \
            --search 'Broken external links in:title' \
            --json number,title \
            --jq '.[] | select(.title == "Broken external links") | .number' \
            | head -n 1)
          echo "number=$issue" >> "$GITHUB_OUTPUT"
          echo "Open tracking issue: ${issue:-none}"

      - name: Open or update the tracking issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken external links"
          issue-number: ${{ steps.tracking_issue.outputs.number }}
          content-filepath: ./lychee/out.md
          labels: |
            link-rot
            automated

      - name: Close the tracking issue when everything resolves
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          issue: ${{ steps.tracking_issue.outputs.number }}
        run: |
          # Closing it here is what makes next week start a fresh report
          # instead of adding onto an old one.
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "All external links resolved as of $(date -u '+%Y-%m-%d'). Closing automatically."
            gh issue close "$issue"
          else
            echo "No open link-rot issue to close."
          fi
