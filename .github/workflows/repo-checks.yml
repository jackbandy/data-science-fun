name: Repo checks

# Three quick checks that don't need the site to be built. They run in
# parallel and finish in well under a minute.
#
# None of these are required checks, so they show up as a red X but don't
# block merging. See .github/workflows/deploy-pages.yml for the build.
#
# generated-files is the exception to "check": on a pull request it repairs the
# drift it finds and pushes the result, so most of the time it never goes red
# at all. The others only report.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # docs/slides/index.html has some lines that are written by a script, not by
  # hand. On a pull request this re-runs the script and pushes the result back
  # onto the branch, so a contributor who edits a deck without re-running the
  # generator gets the sync done for them. Most edits here arrive through
  # GitHub's web editor (CONTRIBUTING.md says prose fixes need no local setup),
  # where a git hook cannot run, so CI is the only place that catch can happen.
  #
  # On a push to main there is no branch to fix up, so it stays a plain check:
  # red means something reached main without passing through either this job or
  # the .githooks/pre-commit hook.
  generated-files:
    runs-on: ubuntu-latest
    # Only this job writes; lint and duplicate-assets stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request build checks out a detached merge commit, which
          # cannot be pushed back. Take the PR's own branch instead. The
          # fallbacks are what a push to main already checks out.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Re-run the slide index generator
        run: python3 docs/slides/shared/sync_slide_index.py docs/slides

      - name: Push the result back to the pull request
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- docs/slides/index.html; then
            echo "index.html already matches the generator output."
            exit 0
          fi

          echo "index.html was out of date. Regenerating it on this branch:"
          git diff --stat -- docs/slides/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/slides/index.html
          git commit -m "Sync docs/slides/index.html with sync_slide_index.py"

          # Naming the refspec rather than relying on upstream tracking, which
          # depends on how actions/checkout wired up the branch.
          # A PR from a fork gets a read-only token, so this cannot push there.
          # Fall back to the instructions rather than a bare git error.
          if ! git push origin "HEAD:${{ github.event.pull_request.head.ref }}"; then
            echo ""
            echo "Could not push the fix -- expected for a pull request from a fork."
            echo "Run this and commit the result:"
            echo "  python3 docs/slides/shared/sync_slide_index.py docs/slides"
            exit 1
          fi

          echo ""
          echo "Pushed. Pull before you make further changes to this branch."

      # A push made with GITHUB_TOKEN deliberately does not start another
      # workflow run, so nothing re-runs this job in a loop above.
      - name: Check the result matches what's committed
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --exit-code -- docs/slides/index.html; then
            echo ""
            echo "docs/slides/index.html is out of date."
            echo "The diff above is what sync_slide_index.py would change."
            echo ""
            echo "Fix it by running this and committing the result:"
            echo "  python3 docs/slides/shared/sync_slide_index.py docs/slides"
            exit 1
          fi
          echo "index.html matches the generator output."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Only checks for things that are actually broken: syntax errors,
      # undefined names, typos in variable names. Ruff's full default rules
      # flag another ~60 style nits in the existing scripts, which would just
      # mean a permanently red check nobody looks at. Tighten later if you
      # ever want to clean those up.
      - name: Check Python scripts
        run: ruff check --select=E9,F63,F7,F82 --exclude=sandbox .

      # shellcheck comes preinstalled on GitHub's Ubuntu runners.
      # sandbox/ is scratch work, so it is not worth gating on.
      - name: Check shell scripts
        run: |
          scripts=$(git ls-files '*.sh' | grep -v '^sandbox/')
          echo "Checking:"; echo "$scripts"
          # --severity=error catches real bugs (bad syntax, unset variables in
          # dangerous spots) while ignoring style suggestions.
          # shellcheck disable=SC2086
          shellcheck --severity=error $scripts

  # Flags files under docs/ that are byte-for-byte copies of each other.
  # Duplicates make the repo bigger and make it unclear which copy is the real
  # one when you go to update an image.
  duplicate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two known sets of duplicates are left in docs/, both deliberate:
      #   - lifecycle-steps/ds-lifecycle-step5.svg and lifecycle/
      #     ds-lifecycle-v5.svg, the same final frame emitted by two generators
      #     that share their geometry.
      #   - ethics-in-data-science/assets/cc-by-nc-sa.svg, the license badge in
      #     the ethics book's page footer. It has its own copy because the
      #     footer is raw HTML in _quarto.yml, which Quarto does not scan for
      #     resources the way it scans the chapter bodies.
      # The baseline is deliberately set above the current count, leaving room
      # for a few more copies before the check complains. Rather than fail on
      # the known sets, this only fails if the count goes past the baseline.
      # Note that the run will keep suggesting a lower number while the count
      # sits under it -- that suggestion is advisory, not a failure.
      - name: Check for new duplicate files
        env:
          BASELINE: 5
        run: |
          # Mode 120000 is a symlink. docs/ethics-in-data-science/assets/shared
          # points at docs/assets/, and md5sum would follow it into a directory
          # and error out, so list blobs only.
          git ls-files -s 'docs/*' \
            | awk '$1 != "120000" { sub(/^[^\t]*\t/, ""); print }' \
            | tr '\n' '\0' | xargs -0 md5sum | sort > all.txt
          awk '{print $1}' all.txt | uniq -d > dups.txt
          count=$(wc -l < dups.txt | tr -d ' ')

          echo "Duplicate sets found: $count (baseline: $BASELINE)"
          echo ""
          while read -r h; do
            echo "Identical files:"
            # md5sum prints "<32-char hash><2 spaces><path>", so strip a fixed
            # 34 characters rather than splitting on whitespace -- filenames
            # with spaces in them would otherwise be reported truncated.
            grep "^$h" all.txt | sed 's/^.\{34\}/    /'
          done < dups.txt

          if [ "$count" -gt "$BASELINE" ]; then
            echo ""
            echo "That's more duplicates than before. Either reuse the existing"
            echo "file instead of adding a copy, or raise BASELINE in this file"
            echo "if the copy is intentional."
            exit 1
          fi

          if [ "$count" -lt "$BASELINE" ]; then
            echo ""
            echo "Nice -- fewer duplicates than the baseline."
            echo "Set BASELINE to $count in this file to keep it from creeping back."
          fi
