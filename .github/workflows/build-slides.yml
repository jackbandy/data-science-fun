name: Build slides

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**/*.md"
      - "docs/css/marp-theme.css"
      - "docs/.marprc.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Compile slides to HTML
        run: npx marp --config docs/.marprc.yml docs/slides/

      - name: Commit compiled HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/slides/*.html
          git diff --staged --quiet || (git commit -m "Build slides" && git push)
