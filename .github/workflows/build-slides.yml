name: Build slides

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**"
      - ".gitignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-slides.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install slide build dependencies
        run: |
          npm ci
          python3 -m pip install pymupdf

      - name: Compile Quarto slides to HTML and PDF
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: cd docs/slides && bash ./build_all_quarto.sh

      - name: Compile Marp slides to HTML and PDF
        env:
          MARP_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: cd docs/slides/marp_archive && bash ./build_all_marp.sh

      - name: Commit compiled slide outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add docs/slides/*.html docs/slides/*.pdf docs/slides/marp_archive/*.html docs/slides/marp_archive/*.pdf
          for support_dir in docs/slides/*_files; do
            [[ -d "$support_dir" ]] && git add -A "$support_dir"
          done
          git diff --staged --quiet || (git commit -m "Build slides" && git push)
