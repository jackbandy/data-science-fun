name: Build slides

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**"
      - ".gitignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-slides.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Jupyter and data science dependencies
        run: python3 -m pip install jupyter nbformat numpy polars seaborn matplotlib

      - name: Install slide build dependencies
        run: npm ci

      - name: Compile Quarto slides to HTML
        env:
          BUILD_PDFS: "false"
        run: cd docs/slides && bash ./build_all_quarto.sh

      # - name: Compile Marp slides to HTML
      #   env:
      #     BUILD_PDFS: "false"
      #   run: cd docs/slides/marp_archive && bash ./build_all_marp.sh

      - name: Commit compiled slide outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add docs/slides/*.html docs/slides/marp_archive/*.html
          for support_dir in docs/slides/*_files; do
            [[ -d "$support_dir" ]] && git add -Af "$support_dir"
          done
          git diff --staged --quiet || (git commit -m "Build slides" && git push)
