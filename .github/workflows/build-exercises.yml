name: Build exercises

# The .md files in exercises/ are the source of truth for the coding exercises.
# This regenerates everything they produce under docs/ and commits it, so the
# published pages can never drift from the sources. The commit to docs/ is what
# triggers deploy-pages.yml.

on:
  push:
    branches: [main]
    paths:
      - "exercises/**"
      - ".github/workflows/build-exercises.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build-exercises-data.py uses only the Python standard library.
      - name: Generate exercise pages
        run: python3 exercises/build-exercises-data.py

      - name: Commit generated exercise outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_data/exercises.yml docs/exercises docs/_includes/exercises-about.html
          git diff --staged --quiet || (git commit -m "Build exercises" && git push)
