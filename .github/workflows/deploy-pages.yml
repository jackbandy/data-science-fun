name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "syllabus_source/**"
      - "meta_analytics_source/**"
      - "exercises/**"
      - "project/**"
      - ".github/workflows/deploy-pages.yml"
  # build on pull requests, so mistakes show up before the site goes live
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "syllabus_source/**"
      - "meta_analytics_source/**"
      - "exercises/**"
      - "project/**"
      - ".github/workflows/deploy-pages.yml"
  # The meta-analytics counts are rebuilt during this build rather than
  # committed, and they drift as links and prose change. This refreshes them
  # even in a week with no site edits. Thursdays at 12:00 UTC, an hour after
  # link-check-external.yml, so the counts and the rot report describe the
  # same set of links.
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full commit history is needed for the changed-files diff below
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Skipped on PRs because it needs permission to write to Pages
      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Detect which docs files changed to skip unchanged renders.
      - name: Detect changed files
        id: changed
        run: |
          EVENT="${{ github.event_name }}"

          # A push tells us the commit it started from (event.before), but a
          # PR doesn't. For PRs, compare against the branch it will merge into
          # so we see every change in the PR, not just the newest commit.
          if [[ "$EVENT" == "pull_request" ]]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi

          # Fall back to a full build when BEFORE is unknown or unresolvable
          # (manual runs, first push, or a force-push after a history rewrite).
          if [[ "$EVENT" == "workflow_dispatch" ]] || \
             [[ -z "$BEFORE" ]] || \
             [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "build_book=true" >> "$GITHUB_OUTPUT"
            echo "render_slides="  >> "$GITHUB_OUTPUT"
            echo "needs_r=true"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Book: rebuild if any file under ethics-in-data-science/ changed
          if echo "$CHANGED" | grep -q '^docs/ethics-in-data-science/'; then
            echo "build_book=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_book=false" >> "$GITHUB_OUTPUT"
          fi

          # Slides: shared inputs (metadata, after-body includes, theme CSS, the
          # build/postprocess scripts) affect every deck, so a change to any of
          # them forces a full render — an empty RENDER_SLIDES means "all".
          if echo "$CHANGED" | grep -qE '^docs/slides/(_metadata\.yml|_quarto\.yml|shared/)'; then
            echo "render_slides=" >> "$GITHUB_OUTPUT"
            echo "needs_r=true"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise render only the decks whose source changed.
          SLIDES=$(echo "$CHANGED" \
            | grep -E '^docs/slides/[^/]+\.(qmd|md)$' \
            | sed 's|.*/||' \
            | tr '\n' ' ' \
            | sed 's/ *$//')
          echo "render_slides=$SLIDES" >> "$GITHUB_OUTPUT"

          # R is only needed by week5.qmd (the one deck using `engine: knitr`).
          # Setting R up takes ~7 minutes, so skip it unless week5 is actually
          # in the render set. If another deck ever grows R chunks, add it here.
          # An empty SLIDES means "render all" to the build script, so it needs R too.
          if [[ -z "$SLIDES" ]] || echo "$SLIDES" | grep -qw 'week5.qmd'; then
            echo "needs_r=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_r=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Quarto (latest release)
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: release

      - name: Log Quarto version
        run: quarto --version

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -r docs/slides/shared/requirements.txt

      # Cache the rendered book output
      - name: Restore Quarto book cache
        id: book-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/ethics-in-data-science/book
          key: book-${{ hashFiles('docs/ethics-in-data-science/**') }}
          restore-keys: book-

      - name: Render Quarto book
        if: steps.changed.outputs.build_book == 'true' || steps.book-cache.outputs.cache-hit != 'true'
        run: quarto render docs/ethics-in-data-science

      # Cache the rendered slide outputs ONLY (deck HTML, support files, libs).

      - name: Restore slides cache
        id: slides-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/slides/week*.html
            docs/slides/week*_files
            docs/slides/week*.pdf
            docs/slides/_libs
          # The key must cover every input the rendered decks depend on: deck
          # sources plus the shared metadata/includes/theme that inject footer
          # scripts and CSS into all of them. Leaving those out meant a shared
          # change hit the cache exactly and skipped the render entirely.
          #
          # The v2 prefix is a one-time invalidation. Caches written before the
          # PDFs joined the paths above hold HTML only, and an exact key hit
          # skips the save step -- so without the bump every run would re-export
          # all 13 PDFs and then throw them away again.
          key: slides-v2-${{ hashFiles('docs/slides/*.qmd', 'docs/slides/*.md', 'docs/slides/_metadata.yml', 'docs/slides/_quarto.yml', 'docs/slides/shared/**') }}
          # Falling back past the v2 prefix lets the first run after the bump
          # restore the old HTML and re-render only what changed, instead of
          # rebuilding all 13 decks from cold. The v1 entries age out on their
          # own; this line can be dropped once they have.
          restore-keys: |
            slides-v2-
            slides-

      # week5.qmd uses `engine: knitr`, which shells out to Rscript. Quarto's
      # setup action does not bundle R, so it must be installed separately.
      #
      # These three steps sit AFTER the slides cache restore, and are gated on
      # it, because setting R up costs ~7 minutes — by far the biggest single
      # cost in this workflow — and it is wasted whenever the slide render is
      # skipped entirely or renders only decks that have no R in them. The
      # `needs_r` output is the deck-level half of that test; see the "Detect
      # changed files" step above. Note `!= 'false'` rather than `== 'true'`:
      # the detect step exits early on some paths without setting the output,
      # and an unset value has to mean "install it" so a render never lands on
      # a runner with no Rscript.
      - name: Set up R
        if: steps.slides-cache.outputs.cache-hit != 'true' && steps.changed.outputs.needs_r != 'false'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        if: steps.slides-cache.outputs.cache-hit != 'true' && steps.changed.outputs.needs_r != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('.github/workflows/deploy-pages.yml') }}
          restore-keys: r-pkgs-

      - name: Install R dependencies
        if: steps.slides-cache.outputs.cache-hit != 'true' && steps.changed.outputs.needs_r != 'false'
        run: Rscript -e 'pkgs <- c("knitr", "rmarkdown", "reticulate", "here", "ggplot2", "ggtext", "patchwork", "svglite"); install.packages(setdiff(pkgs, rownames(installed.packages())))'

      # HTML decks are required: if this fails, the deploy should fail
      - name: Render Quarto slides (HTML — required)
        if: steps.slides-cache.outputs.cache-hit != 'true'
        env:
          BUILD_PDFS: "false"
          SKIP_VENV: "true"
          RENDER_SLIDES: ${{ steps.changed.outputs.render_slides }}
        run: |
          cd docs/slides
          bash shared/build_all_quarto.sh

      # PDF export is a bonus - it needs a headless browser plus Node >=22 
      # The steps below are non-blocking: if the browser, Node, or any deck's export fails,
      # continue-on-error lets the HTML-only deploy proceed.
      # Skipped on PRs.
      - name: Set up Node (>=22 for global WebSocket)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Chromium for slide PDF export
        id: setup-chrome
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      # Exporting all 13 decks takes ~2.5 minutes, so only the decks that need
      # a PDF get one. Two things put a deck on that list:
      #
      #   1. Its source changed on this push (steps.changed.outputs.render_slides).
      #   2. It has no PDF on disk. The cache above carries PDFs between runs,
      #      but a cold cache, a restore-keys partial hit, or a cache written by
      #      a PR run (where this step is skipped) all leave some or all of them
      #      missing. Checking the filesystem covers every one of those without
      #      having to reason about which happened.
      #
      # An empty list means every PDF is already present and current, so the
      # export is skipped outright — RENDER_SLIDES="" would mean "all decks" to
      # the build script, which is the opposite of what we want here.
      - name: Render slide PDFs (bonus — non-blocking)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BUILD_PDFS: "true"
          SKIP_HTML: "true"
          SKIP_VENV: "true"
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHANGED_SLIDES: ${{ steps.changed.outputs.render_slides }}
          SLIDES_CACHE_HIT: ${{ steps.slides-cache.outputs.cache-hit }}
        run: |
          cd docs/slides

          # An empty CHANGED_SLIDES is ambiguous on its own: the detect step
          # writes it both for "a shared input changed, so rebuild everything"
          # and for "no slide source changed at all". The slides cache tells
          # the two apart. Its key covers exactly the files the detect step
          # looks at, so an exact hit can only mean nothing slide-related
          # changed — which is also why the HTML render step above can get away
          # with testing the cache alone.
          if [[ -z "${CHANGED_SLIDES// }" && "$SLIDES_CACHE_HIT" != "true" ]]; then
            NEEDED=$(ls week*.qmd week*.md 2>/dev/null | tr '\n' ' ')
          else
            NEEDED="$CHANGED_SLIDES"
            for src in week*.qmd week*.md; do
              [[ -e "$src" ]] || continue
              base="${src%.*}"
              if [[ ! -f "$base.pdf" ]]; then
                NEEDED="$NEEDED $src"
              fi
            done
          fi

          # Collapse duplicates (a changed deck with no PDF is listed twice).
          NEEDED=$(echo "$NEEDED" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

          if [[ -z "${NEEDED// }" ]]; then
            echo "Every slide PDF is present and up to date; skipping export."
            exit 0
          fi

          echo "Exporting PDFs for: $NEEDED"
          RENDER_SLIDES="$NEEDED" bash shared/build_all_quarto.sh

      # The generated regions of docs/slides/index.html are rewritten here, not
      # taken from the commit. build_all_quarto.sh already runs this script, but
      # only when it runs at all — an exact slides-cache hit skips the render
      # step above, and the cache key covers the deck sources without covering
      # docs/_data/schedule.csv, which feeds the title parentheticals and the
      # summary table's Topics column. So a schedule-only edit hits the cache
      # and would otherwise deploy the stale index committed alongside it.
      #
      # Running it as its own step instead of widening the cache key keeps a
      # schedule.csv edit from forcing a full re-render of every deck (and a
      # re-export of every PDF) to refresh a file the script builds from the
      # sources in well under a second. Nothing here needs the decks built:
      # the anchors come from the deck sources, which is what lets the
      # repo-checks.yml drift check run against a tree with no decks in it.
      #
      # This only fixes what gets deployed. The committed index.html can still
      # drift, and repo-checks.yml is still the thing that says so.
      - name: Sync the generated regions of the slide index
        run: python3 docs/slides/shared/sync_slide_index.py docs/slides

      # The syllabus is built here rather than committed, so it must exist on
      # every run. Cache it on an exact key only: a hit skips both the ~1 GB
      # TeX Live install and the render, keeps the "This version created" stamp
      - name: Restore syllabus cache
        id: syllabus-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/syllabus
          key: syllabus-${{ hashFiles('syllabus_source/**', 'docs/_data/schedule.csv', 'docs/assets/branding/uic-black-logo.svg') }}

      - name: Install syllabus build tools
        if: steps.syllabus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc librsvg2-bin fontconfig fonts-liberation \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-plain-generic

      # Writes docs/syllabus/{index.html,syllabus.pdf}. The HTML carries front
      # matter, so the Jekyll step below expands its masthead include.
      - name: Build syllabus (HTML + PDF)
        if: steps.syllabus-cache.outputs.cache-hit != 'true'
        run: bash syllabus_source/build.sh

      # The meta-analytics counts are rebuilt here, into the working tree, and
      # published from _site like any other generated page. They used to be
      # committed back to main by a separate workflow, but a required "build"
      # status check on main blocks the bot from pushing, and the page reads
      # the JSON at runtime anyway -- it only needs the files to exist in the
      # deployed site, not in the repo. The committed copies under
      # docs/meta-analytics/data/ are now just a seed for local preview; the
      # deployed numbers always come from this step.
      #
      # The script shells out to `lychee --dump`, which extracts links without
      # checking them -- the same extractor link-check-external.yml checks
      # with. lychee-action only runs a check, so the binary is installed
      # directly. Pinned: a lychee release that changed its dump output would
      # silently change the numbers on the page.
      - name: Install lychee for meta-analytics link extraction
        env:
          LYCHEE_TAG: lychee-v0.24.2
          ASSET: lychee-x86_64-unknown-linux-gnu.tar.gz
        run: |
          base="https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_TAG}"
          curl -fsSL -o "$ASSET" "$base/$ASSET"
          curl -fsSL -o "$ASSET.sha256" "$base/$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"

          # The binary is nested inside a per-target directory
          # (lychee-x86_64-unknown-linux-gnu/lychee), not at the archive root,
          # and that layout is not part of any promise the project makes. So
          # unpack the whole thing and go find the binary rather than naming a
          # path that a future release can quietly rearrange. The completion
          # scripts alongside it are _lychee, lychee.fish, and so on, so an
          # exact-name match picks out the one real executable.
          mkdir -p lychee-unpack
          tar -xzf "$ASSET" -C lychee-unpack
          binary="$(find lychee-unpack -type f -name lychee | head -n 1)"
          if [[ -z "$binary" ]]; then
            echo "No lychee binary found in $ASSET; archive contains:" >&2
            tar -tzf "$ASSET" >&2
            exit 1
          fi
          sudo install -m 755 "$binary" /usr/local/bin/lychee
          rm -rf lychee-unpack "$ASSET" "$ASSET.sha256"
          lychee --version

      # The English baseline for the "Unusual words" section. build_data.py
      # downloads it on a miss; caching keeps that to roughly once a month
      # instead of every run. Not committed to the repo -- see
      # meta_analytics_source/english_frequencies.md for why.
      - name: Cache the English frequency baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: meta_analytics_source/.cache
          key: english-frequencies-count_1w-v1

      - name: Rebuild meta-analytics data
        # AI_USAGE_ENDPOINT is the counter Worker in ai_usage_endpoint/. Set it as a
        # repository variable to turn the "AI tools" section on; unset, the build
        # prints a note, skips ai-usage.json, and the section stays hidden.
        env:
          AI_USAGE_ENDPOINT: ${{ vars.AI_USAGE_ENDPOINT }}
        run: python3 meta_analytics_source/build_data.py

      # The coding exercises are generated from exercises/*/exercise.md into the
      # working tree and published from _site, for the same reason as the
      # meta-analytics counts above: a bot push to main is blocked by the
      # required "build" status check, and the deployed site only needs these
      # files to exist at build time, not in the repo. Stdlib only, so there is
      # nothing to install. Writes docs/_data/exercises.yml, docs/exercises/,
      # and docs/_includes/exercises-about.html, all of which are gitignored.
      - name: Build coding exercises
        run: python3 exercises/build-exercises-data.py

      # Same arrangement for the group-project checkpoints, generated from
      # project/*.md into docs/project/<slug>.md (gitignored). Checkpoints whose
      # frontmatter says `draft: true` are skipped, so unfinished stubs are not
      # published. docs/project/index.html is hand-written and committed.
      - name: Build project checkpoints
        run: python3 project/build-project-data.py

      # Same arrangement again for the dataset index, generated from
      # datasets/README.md into docs/datasets/index.html (gitignored). The data
      # files themselves are not published; the page links to the folders on
      # GitHub. Stdlib only.
      - name: Build datasets page
        run: python3 datasets/build-datasets-page.py

      # Strip dev/build cruft so we don't ship venvs and caches to GitHub Pages.
      # TODO: Verify the slide notebooks (docs/slides/week*.ipynb)
      - name: Prune build artifacts before upload
        run: |
          find docs -type d -name '.venv' -prune -exec rm -rf {} +
          find docs -type d -name '.quarto' -prune -exec rm -rf {} +
          find docs -type f -name '*.quarto_ipynb' -delete
          find docs -type f -name '.DS_Store' -delete

      # Runs last, once every generated page is on disk.
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      # Runs AFTER Jekyll, on purpose
      - name: Publish slide sources for download
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/slides
          cp docs/slides/week*.qmd _site/slides/
          ls -1 _site/slides/week*.qmd

      # Also after Jekyll, as a belt-and-braces copy of what `include:` in
      # docs/_config.yml should already do. The real reason security.txt was
      # 404ing is the upload step's dotfile filter; see "Prune dotfiles" below.
      # The step fails loudly if the source file is missing, so a rename can't
      # silently take security.txt off the site again.
      - name: Publish .well-known
        run: |
          test -f docs/.well-known/security.txt
          mkdir -p _site/.well-known
          cp -R docs/.well-known/. _site/.well-known/
          ls -la _site/.well-known/

      # The Python Yard (JupyterLite) is built after Jekyll, straight into
      # _site/yard/. docs/_config.yml excludes docs/yard/, so Jekyll neither
      # publishes the sources nor collides with this output. The build pins its
      # own packages (docs/yard/requirements.txt) and bundles the lecture
      # notebooks; datasets are read from GitHub at runtime. See docs/yard/PLAN.md.
      - name: Build Python Yard
        run: |
          uv pip install --system -r docs/yard/requirements.txt
          SKIP_VENV=1 bash docs/yard/build.sh _site/yard
          test -f _site/yard/notebooks/index.html
          test -f _site/yard/files/welcome.ipynb

      # Looks for links that point to internal pages or files that don't exist.
      # --offline means it only checks local files
      # Outside links are handled weekly - link-check-external.yml.
      #
      # PDFs are excluded
      #
      # --root-dir resolves root-relative links (the masthead's "/", "/slides/")
      # against _site; without it every one of them errors out as unresolvable.
      #
      # --include-verbatim is deliberately not set: it makes lychee read the
      # inline <script> blocks in the reveal.js decks and Quarto book, where
      # JS string fragments ("#", ref.getAttribute('data-footnote-href')) get
      # misparsed as links and fail
      # the <a href> links are still checked.
      # Advisory on both main and PRs: 
      #  a broken link anywhere can fail the run for an unrelated PR
      # The errors still show up but they don't block a merge.
      - name: Check internal links
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --exclude '\.pdf$'
            --exclude-path _site/slides/_libs
            --exclude-path _site/ethics-in-data-science/book/site_libs
            --exclude-path _site/yard
            '_site/**/*.html'
          fail: true

      # upload-pages-artifact drops every dotfile unless include-hidden-files
      # is set -- that, not Jekyll, is what kept security.txt off the site.
      # Turning it on would also publish any other dotfile the builds leave in
      # _site (e.g. JupyterLite's state files), so prune those first and let
      # .well-known/ be the only hidden path that ships.
      - name: Prune dotfiles except .well-known
        run: |
          find _site -mindepth 1 -name '.*' ! -path '_site/.well-known' -prune -print -exec rm -rf {} +
          test -f _site/.well-known/security.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  # Publishing is a separate job
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Uses the site the build job already uploaded, so there's nothing to
      # check out or rebuild here.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
