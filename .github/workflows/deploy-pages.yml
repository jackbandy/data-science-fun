name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "syllabus_source/**"
      - ".github/workflows/deploy-pages.yml"
  # build on pull requests, so mistakes show up before the site goes live
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "syllabus_source/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full commit history is needed for the changed-files diff below
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Skipped on PRs because it needs permission to write to Pages
      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Detect which docs files changed to skip unchanged renders.
      - name: Detect changed files
        id: changed
        run: |
          EVENT="${{ github.event_name }}"

          # A push tells us the commit it started from (event.before), but a
          # PR doesn't. For PRs, compare against the branch it will merge into
          # so we see every change in the PR, not just the newest commit.
          if [[ "$EVENT" == "pull_request" ]]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi

          # Fall back to a full build when BEFORE is unknown or unresolvable
          # (manual runs, first push, or a force-push after a history rewrite).
          if [[ "$EVENT" == "workflow_dispatch" ]] || \
             [[ -z "$BEFORE" ]] || \
             [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "build_book=true" >> "$GITHUB_OUTPUT"
            echo "render_slides="  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Book: rebuild if any file under ethics-in-data-science/ changed
          if echo "$CHANGED" | grep -q '^docs/ethics-in-data-science/'; then
            echo "build_book=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_book=false" >> "$GITHUB_OUTPUT"
          fi

          # Slides: collect base names of changed deck files (passed to RENDER_SLIDES)
          SLIDES=$(echo "$CHANGED" \
            | grep -E '^docs/slides/[^/]+\.(qmd|md)$' \
            | sed 's|.*/||' \
            | tr '\n' ' ' \
            | sed 's/ *$//')
          echo "render_slides=$SLIDES" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto (latest release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Log Quarto version
        run: quarto --version

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -r docs/slides/requirements.txt

      # week5.qmd uses `engine: knitr`, which shells out to Rscript. Quarto's
      # setup action does not bundle R, so it must be installed separately.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('.github/workflows/deploy-pages.yml') }}
          restore-keys: r-pkgs-

      - name: Install R dependencies
        run: Rscript -e 'pkgs <- c("knitr", "rmarkdown", "reticulate", "here", "ggplot2", "ggtext", "patchwork", "svglite"); install.packages(setdiff(pkgs, rownames(installed.packages())))'

      # Cache the rendered book output
      - name: Restore Quarto book cache
        id: book-cache
        uses: actions/cache@v4
        with:
          path: docs/ethics-in-data-science/book
          key: book-${{ hashFiles('docs/ethics-in-data-science/**') }}
          restore-keys: book-

      - name: Render Quarto book
        if: steps.changed.outputs.build_book == 'true' || steps.book-cache.outputs.cache-hit != 'true'
        run: quarto render docs/ethics-in-data-science

      # Cache the rendered slide outputs ONLY (deck HTML, support files, libs).

      - name: Restore slides cache
        id: slides-cache
        uses: actions/cache@v4
        with:
          path: |
            docs/slides/week*.html
            docs/slides/week*_files
            docs/slides/_libs
          key: slides-${{ hashFiles('docs/slides/*.qmd', 'docs/slides/*.md', 'docs/slides/postprocess_slides.py', 'docs/slides/requirements.txt') }}
          restore-keys: slides-

      # HTML decks are required: if this fails, the deploy should fail
      - name: Render Quarto slides (HTML — required)
        if: steps.slides-cache.outputs.cache-hit != 'true'
        env:
          BUILD_PDFS: "false"
          SKIP_VENV: "true"
          RENDER_SLIDES: ${{ steps.changed.outputs.render_slides }}
        run: |
          cd docs/slides
          bash ./build_all_quarto.sh

      # PDF export is a bonus - it needs a headless browser plus Node >=22 
      # The steps below are non-blocking: if the browser, Node, or any deck's export fails,
      # continue-on-error lets the HTML-only deploy proceed.
      # Skipped on PRs.
      - name: Set up Node (>=22 for global WebSocket)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chromium for slide PDF export
        id: setup-chrome
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1

      - name: Render slide PDFs (bonus — non-blocking)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BUILD_PDFS: "true"
          SKIP_HTML: "true"
          SKIP_VENV: "true"
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          cd docs/slides
          bash ./build_all_quarto.sh

      # The syllabus is built here rather than committed, so it must exist on
      # every run. Cache it on an exact key only: a hit skips both the ~1 GB
      # TeX Live install and the render, keeps the "This version created" stamp
      - name: Restore syllabus cache
        id: syllabus-cache
        uses: actions/cache@v4
        with:
          path: docs/syllabus
          key: syllabus-${{ hashFiles('syllabus_source/**', 'docs/_data/schedule.csv', 'docs/assets/branding/uic-black-logo.svg') }}

      - name: Install syllabus build tools
        if: steps.syllabus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc librsvg2-bin fontconfig fonts-liberation \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-plain-generic

      # Writes docs/syllabus/{index.html,syllabus.pdf}. The HTML carries front
      # matter, so the Jekyll step below expands its masthead include.
      - name: Build syllabus (HTML + PDF)
        if: steps.syllabus-cache.outputs.cache-hit != 'true'
        run: bash syllabus_source/build.sh

      # Strip dev/build cruft so we don't ship venvs and caches to GitHub Pages.
      # TODO: Verify the slide notebooks (docs/slides/week*.ipynb)
      - name: Prune build artifacts before upload
        run: |
          find docs -type d -name '.venv' -prune -exec rm -rf {} +
          find docs -type d -name '.quarto' -prune -exec rm -rf {} +
          find docs -type f -name '*.quarto_ipynb' -delete
          find docs -type f -name '.DS_Store' -delete

      # Runs last, once every generated page is on disk.
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # Runs AFTER Jekyll, on purpose
      - name: Publish slide sources for download
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/slides
          cp docs/slides/week*.qmd _site/slides/
          ls -1 _site/slides/week*.qmd

      # Looks for links that point to internal pages or files that don't exist.
      # --offline means it only checks local files
      # Outside links are handled weekly - link-check-external.yml.
      #
      # PDFs are excluded
      #
      # --root-dir resolves root-relative links (the masthead's "/", "/slides/")
      # against _site; without it every one of them errors out as unresolvable.
      #
      # --include-verbatim is deliberately not set: it makes lychee read the
      # inline <script> blocks in the reveal.js decks and Quarto book, where
      # JS string fragments ("#", ref.getAttribute('data-footnote-href')) get
      # misparsed as links and fail
      # the <a href> links are still checked.
      - name: Check internal links
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --exclude '\.pdf$'
            --exclude-path _site/slides/_libs
            --exclude-path _site/ethics-in-data-science/book/site_libs
            '_site/**/*.html'
          fail: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishing is a separate job
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Uses the site the build job already uploaded, so there's nothing to
      # check out or rebuild here.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
