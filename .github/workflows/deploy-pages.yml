name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Jupyter and data science dependencies
        run: python3 -m pip install jupyter nbformat numpy polars seaborn matplotlib

      - name: Build FAQ
        run: cd docs/scripts && ./build_faq.sh

      - name: Render Quarto book
        run: quarto render docs/ethics-in-data-science

      - name: Render Quarto slides
        env:
          BUILD_PDFS: "false"
        run: cd docs/slides && bash ./build_all_quarto.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
