name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "syllabus_source/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Full commit history is needed for the changed-files diff below, but a
      # blob:none partial clone skips downloading historic file contents
      # (checkout lazily fetches only the blobs the working tree needs).
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # Detect which docs files changed in this push so we can skip unchanged renders.
      # workflow_dispatch and initial pushes (zero SHA) always build everything.
      - name: Detect changed files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          EVENT="${{ github.event_name }}"

          # Fall back to a full build when BEFORE is unknown or unresolvable
          # (manual runs, first push, or a force-push after a history rewrite).
          if [[ "$EVENT" == "workflow_dispatch" ]] || \
             [[ -z "$BEFORE" ]] || \
             [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "build_book=true" >> "$GITHUB_OUTPUT"
            echo "render_slides="  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Book: rebuild if any file under ethics-in-data-science/ changed
          if echo "$CHANGED" | grep -q '^docs/ethics-in-data-science/'; then
            echo "build_book=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_book=false" >> "$GITHUB_OUTPUT"
          fi

          # Slides: collect base names of changed deck files (passed to RENDER_SLIDES)
          SLIDES=$(echo "$CHANGED" \
            | grep -E '^docs/slides/[^/]+\.(qmd|md)$' \
            | sed 's|.*/||' \
            | tr '\n' ' ' \
            | sed 's/ *$//')
          echo "render_slides=$SLIDES" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto (latest release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Log Quarto version
        run: quarto --version

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -r docs/slides/requirements.txt

      # week5.qmd uses `engine: knitr`, which shells out to Rscript. Quarto's
      # setup action does not bundle R, so it must be installed separately.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('.github/workflows/deploy-pages.yml') }}
          restore-keys: r-pkgs-

      - name: Install R dependencies
        run: Rscript -e 'pkgs <- c("knitr", "rmarkdown", "reticulate", "here", "ggplot2", "ggtext", "patchwork", "svglite"); install.packages(setdiff(pkgs, rownames(installed.packages())))'

      # Cache the rendered book output. Exact key covers all source files under
      # ethics-in-data-science/; a restore-keys fallback provides the last good
      # build when sources change (triggering a fresh render below).
      - name: Restore Quarto book cache
        id: book-cache
        uses: actions/cache@v4
        with:
          path: docs/ethics-in-data-science/book
          key: book-${{ hashFiles('docs/ethics-in-data-science/**') }}
          restore-keys: book-

      - name: Render Quarto book
        if: steps.changed.outputs.build_book == 'true' || steps.book-cache.outputs.cache-hit != 'true'
        run: quarto render docs/ethics-in-data-science

      # Cache the rendered slide outputs ONLY (deck HTML, support files, libs).
      # Exact key covers all slide source files plus the postprocessor and
      # requirements; a restore-keys fallback lets us reuse unchanged decks and
      # only re-render what changed (via RENDER_SLIDES). Tracked sources
      # (week*.qmd/.md/.ipynb, index.html) must stay OUT of the cache path: a
      # stale restore would otherwise overwrite the fresh checkout.
      - name: Restore slides cache
        id: slides-cache
        uses: actions/cache@v4
        with:
          path: |
            docs/slides/week*.html
            docs/slides/week*_files
            docs/slides/_libs
          key: slides-${{ hashFiles('docs/slides/*.qmd', 'docs/slides/*.md', 'docs/slides/postprocess_slides.py', 'docs/slides/requirements.txt') }}
          restore-keys: slides-

      # HTML decks are required: if this fails, the deploy should fail loudly.
      # Skipped on exact cache hit (no sources changed). On a partial restore,
      # RENDER_SLIDES limits rendering to only the changed deck files.
      - name: Render Quarto slides (HTML — required)
        if: steps.slides-cache.outputs.cache-hit != 'true'
        env:
          BUILD_PDFS: "false"
          SKIP_VENV: "true"
          RENDER_SLIDES: ${{ steps.changed.outputs.render_slides }}
        run: |
          cd docs/slides
          bash ./build_all_quarto.sh

      # PDF export is a bonus. It needs a headless browser plus Node >=22 (for the
      # global WebSocket the CDP driver in build_all_quarto.sh relies on). The steps
      # below are non-blocking: if the browser, Node, or any deck's export fails,
      # continue-on-error lets the HTML-only deploy proceed.
      - name: Set up Node (>=22 for global WebSocket)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chromium for slide PDF export
        id: setup-chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1

      - name: Render slide PDFs (bonus — non-blocking)
        continue-on-error: true
        env:
          BUILD_PDFS: "true"
          SKIP_HTML: "true"
          SKIP_VENV: "true"
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          cd docs/slides
          bash ./build_all_quarto.sh

      # The syllabus is built here rather than committed, so it must exist on
      # every run. Cache it on an exact key only: a hit skips both the ~1 GB
      # TeX Live install and the render, and keeps the "This version created"
      # stamp from when the content actually changed rather than resetting it
      # on unrelated pushes. Any source change misses and rebuilds in full.
      - name: Restore syllabus cache
        id: syllabus-cache
        uses: actions/cache@v4
        with:
          path: docs/syllabus
          key: syllabus-${{ hashFiles('syllabus_source/**', 'docs/_data/schedule.csv', 'docs/assets/branding/uic-black-logo.svg') }}

      - name: Install syllabus build tools
        if: steps.syllabus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc librsvg2-bin fontconfig fonts-liberation \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended

      # Writes docs/syllabus/{index.html,syllabus.pdf}. The HTML carries front
      # matter, so the Jekyll step below expands its masthead include.
      - name: Build syllabus (HTML + PDF)
        if: steps.syllabus-cache.outputs.cache-hit != 'true'
        run: bash syllabus_source/build.sh

      # Strip dev/build cruft so we don't ship venvs and caches to GitHub Pages.
      # TODO: Verify the slide notebooks (docs/slides/week*.ipynb) are actually
      # reachable on the deployed site (e.g. dodatascience.fun/slides/week0.ipynb)
      # so students can download the code — this prune must not remove them.
      - name: Prune build artifacts before upload
        run: |
          find docs -type d -name '.venv' -prune -exec rm -rf {} +
          find docs -type d -name '.quarto' -prune -exec rm -rf {} +
          find docs -type f -name '*.quarto_ipynb' -delete
          find docs -type f -name '.DS_Store' -delete

      # Runs last, once every generated page is on disk. Jekyll expands the
      # shared includes into the pages that carry front matter and renders
      # docs/faq.md; the Quarto output above has none, so it is copied as-is.
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
