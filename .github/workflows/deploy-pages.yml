name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto (latest release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Log Quarto version
        run: quarto --version

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -r docs/slides/requirements.txt

      - name: Build FAQ
        run: cd docs/scripts && ./build_faq.sh

      - name: Render Quarto book
        run: quarto render docs/ethics-in-data-science

      - name: Render Quarto slides
        env:
          BUILD_PDFS: "false"
        run: |
          cd docs/slides
          bash ./build_all_quarto.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
