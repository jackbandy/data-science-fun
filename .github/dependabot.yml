version: 2

updates:
  # Keeps the action versions in .github/workflows/ up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      # 6am local year-round
      time: "06:00"
      timezone: "America/Chicago"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      # Bundle the small routine updates into one PR instead of six.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # No pip entry: the slides' Python packages are locked to the Python Yard's Pyodide release, so they move when docs/yard/requirements.txt is bumped and docs/slides/shared/lock_requirements.sh is re-run, not one package at a time.
